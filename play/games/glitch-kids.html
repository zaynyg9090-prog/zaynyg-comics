// ---------- map building helpers ----------
function newMap(w, h, fillId) { return { w, h, t: new Uint8Array(w * h).fill(fillId), deco: [] }; }
function setT(m, x, y, id) { if (x >= 0 && y >= 0 && x < m.w && y < m.h) m.t[y * m.w + x] = id; }
function getT(m, x, y) { if (x < 0 || y < 0 || x >= m.w || y >= m.h) return T.ROCK; return m.t[y * m.w + x]; }
function fill(m, x, y, w, h, id) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) setT(m, i, j, id); }
function border(m, id) { fill(m, 0, 0, m.w, 1, id); fill(m, 0, m.h - 1, m.w, 1, id); fill(m, 0, 0, 1, m.h, id); fill(m, m.w - 1, 0, 1, m.h, id); }
function blob(m, cx, cy, rx, ry, id, only) { for (let j = Math.floor(cy - ry); j <= cy + ry; j++) for (let i = Math.floor(cx - rx); i <= cx + rx; i++) { const dx = (i - cx) / rx, dy = (j - cy) / ry; if (dx * dx + dy * dy <= 1 && (only === undefined || only.includes(getT(m, i, j)))) setT(m, i, j, id); } }
function carve(m, pts, rad, id, river, bridge) {
  for (let k = 0; k < pts.length - 1; k++) {
    const [x0, y0] = pts[k], [x1, y1] = pts[k + 1]; const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 2 + 1;
    for (let s = 0; s <= n; s++) { const x = x0 + (x1 - x0) * s / n, y = y0 + (y1 - y0) * s / n;
      for (let j = Math.floor(y - rad); j <= Math.ceil(y + rad); j++) for (let i = Math.floor(x - rad); i <= Math.ceil(x + rad); i++) {
        if ((i - x) ** 2 + (j - y) ** 2 <= rad * rad + 0.3 && i > 0 && j > 0 && i < m.w - 1 && j < m.h - 1) setT(m, i, j, getT(m, i, j) === river ? bridge : id); } }
  }
}
function scatter(m, rng, id, count, on, avoid) {
  let placed = 0, tries = 0;
  while (placed < count && tries++ < count * 30) {
    const x = 1 + Math.floor(rng() * (m.w - 2)), y = 1 + Math.floor(rng() * (m.h - 2));
    if (getT(m, x, y) !== on) continue;
    if (avoid && avoid.some(r => x >= r[0] - 1 && x <= r[0] + r[2] && y >= r[1] - 1 && y <= r[1] + r[3])) continue;
    setT(m, x, y, id); placed++;
  }
}

// ---------- state ----------

// ---------- enemy AI ----------
function updateEnemies(dt) {

      else if (e.charging > 0) { e.charging -= dt; if (moveBody(e, e.cvx * dt, e.cvy * dt, e.r * 0.7)) e.charging = 0; }
      else if (d < aggro) { moveBody(e, dx / d * e.spd * dt, dy / d * e.spd * dt, e.r * 0.7); e.cd -= dt; if (d < 170 && e.cd <= 0) { e.wind = 0.55; e.cd = 2.5; } }
      else wander(e, dt);
    }
    else if (e.ai === 'shoot') {
      if (d < aggro + 40) { const want = d > 150 ? 1 : d < 100 ? -1 : 0; moveBody(e, dx / d * e.spd * want * dt, dy / d * e.spd * want * dt, e.r * 0.7); e.cd -= dt;
        if (e.cd <= 0 && d < 260) { e.cd = 1.8 + Math.random(); eShot(e, dx / d * 150, dy / d * 150, e.type === 'donut' ? 'sugar' : 'data'); } }
      else wander(e, dt);
    }
    else { // chase / float / split
      if (d < aggro) { const sp = e.ai === 'float' ? e.spd * (0.7 + Math.sin(G.t * 3 + e.seed) * 0.4) : e.spd; moveBody(e, dx / d * sp * dt, dy / d * sp * dt, e.r * 0.7); }
      else wander(e, dt);
    }

    const x = (sp.x + 0.5) * TS, y = (sp.y + 0.5) * TS; if (Math.hypot(x - S.x, y - S.y) > 320) { spawnEnemy(sp.type, x, y, Zn.def.level, { home:r.home }); G.respawn.splice(G.respawn.indexOf(r), 1); } }

    const bx = (bd.x + 0.5) * TS, by = (bd.y + 0.5) * TS; if (Math.hypot(bx - S.x, by - S.y) < 230) { bossRef = spawnEnemy(bd.type, bx, by, 1); toast(ENEMIES[bd.type].name.toUpperCase() + '!', '#ff6b6b'); sfx('boss'); G.shake = 0.5; } }

}
function wander(e, dt) { e.wander -= dt; if (e.wander <= 0) { e.wander = 1 + Math.random() * 2; const a = Math.random() * 6.28; e.wx = Math.cos(a); e.wy = Math.sin(a); if (Math.hypot(e.x - e.hx, e.y - e.hy) > 90) { const dx = e.hx - e.x, dy = e.hy - e.y, d = Math.hypot(dx, dy); e.wx = dx / d; e.wy = dy / d; } }
  moveBody(e, e.wx * e.spd * 0.4 * dt, e.wy * e.spd * 0.4 * dt, e.r * 0.7); }
function eShot(e, vx, vy, kind) { shots.push({ x:e.x, y:e.y - 8, vx, vy, r:kind === 'pep' ? 9 : 7, dmg:e.atk, from:'e', life:3, kind }); }
function bossAI(e, dt, dx, dy, d) {
  const enraged = e.hp < e.maxHp * 0.5; e.timer -= dt; const sp = e.spd * (enraged ? 1.3 : 1);
  if (e.dashT > 0) { e.dashT -= dt; moveBody(e, e.dvx * dt, e.dvy * dt, e.r * 0.6); }
  else if (d > 60) moveBody(e, dx / d * sp * dt, dy / d * sp * dt, e.r * 0.6);

  if (e.timer > 0) return;
  e.phase++; const ring = (n, kind, spd) => { for (let i = 0; i < n; i++) { const a = i / n * 6.28 + e.phase * 0.3; eShot(e, Math.cos(a) * spd, Math.sin(a) * spd, kind); } };
  const aim = (n, spread, kind, spd) => { const a0 = Math.atan2(dy, dx); for (let i = 0; i < n; i++) { const a = a0 + (i - (n - 1) / 2) * spread; eShot(e, Math.cos(a) * spd, Math.sin(a) * spd, kind); } };
  const summon = (type, n) => { if (minions > 5) return; for (let i = 0; i < n; i++) { const a = Math.random() * 6.28; const m = spawnEnemy(type, e.x + Math.cos(a) * 60, e.y + 40 + Math.sin(a) * 30, ZONES[S.zone].level); m.minion = true; m.noRespawn = true; } };

  else if (e.type === 'finalexam') { const p = e.phase % 4; if (p === 0) aim(5, 0.22, 'num', 170); else if (p === 1) summon('minisheet', 3); else if (p === 2) ring(enraged ? 16 : 12, 'num', 130); else aim(3, 0.15, 'num', 220); e.timer = enraged ? 1.6 : 2.2; }
  else if (e.type === 'pizzaemperor') { const p = e.phase % 4; if (p === 0) ring(enraged ? 16 : 12, 'pep', 140); else if (p === 1) { e.dashT = 0.6; e.dvx = dx / d * 330; e.dvy = dy / d * 330; } else if (p === 2) summon(Math.random() < 0.5 ? 'nugget' : 'meatball', 2); else aim(enraged ? 7 : 5, 0.2, 'pep', 190); e.timer = enraged ? 1.6 : 2.1; }

}

// ---------- shots / particles ----------
function updateShots(dt) {
  for (const s of shots.slice()) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    let dead = s.life <= 0 || (s.kind !== 'bubble' && s.kind !== 'data' && solidAt(s.x, s.y + 6) && s.from === 'p');
    if (s.from === 'p') { for (const e of enemies) { if (e.npc) continue; if (Math.hypot(e.x - s.x, (e.y - 8) - s.y) < e.r + s.r) { hurtEnemy(e, s.dmg, s.vx / 360, s.vy / 360, s.crit); burst(s.x, s.y, 6, [s.col, '#fff'], 70); dead = true; break; } } }
    else if (Math.hypot(S.x - s.x, (S.y - 8) - s.y) < 12 + s.r) { hurtPlayer(s.dmg, s); dead = true; }
    if (dead) shots.splice(shots.indexOf(s), 1);
  }
  for (const p of parts.slice()) { p.t -= dt; if (!p.ring) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.vx *= 0.97; } if (p.t <= 0) parts.splice(parts.indexOf(p), 1); }
  for (const x of texts.slice()) { x.t -= dt; x.y -= 34 * dt; if (x.t <= 0) texts.splice(texts.indexOf(x), 1); }
  for (const x of toasts.slice()) { x.t -= dt; if (x.t <= 0) toasts.splice(toasts.indexOf(x), 1); }
}

  if (dlg.shown < dlg.text.length) { dlg.shown = dlg.text.length; document.getElementById('dtext').textContent = dlg.text; return; }
  dlg.i++; if (dlg.i < dlg.lines.length) return showLine();
  document.getElementById('dialog').classList.add('hidden'); G.state = 'play'; const cb = dlg.cb; dlg.cb = null; if (cb) cb();
}
setInterval(() => { if (G.state === 'dialog' && dlg.shown < dlg.text.length) { dlg.shown = Math.min(dlg.text.length, dlg.shown + 2); document.getElementById('dtext').textContent = dlg.text.slice(0, dlg.shown); } }, 16);
document.getElementById('dialog').addEventListener('pointerdown', e => { e.preventDefault(); audio(); advanceDialog(); });

// ---------- panels ----------
function showPanel(html, closable = true) {
  G.state = 'menu'; const p = document.getElementById('panel'); p.classList.remove('hidden');
  document.getElementById('pbody').innerHTML = html; document.getElementById('pclose').style.display = closable ? '' : 'none'; p.scrollTop = 0;
}
function closePanel() { document.getElementById('panel').classList.add('hidden'); if (G.state === 'menu') G.state = 'play'; }
document.getElementById('pclose').onclick = closePanel;
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' })[c]); }
function openQuests() {
  const row = id => { const d = QUESTS[id], st = qStep(id); if (st < 0) return ''; const q = S.Q[id];
    const step = st === 99 ? '<span class="done">COMPLETE</span>' : esc(d.steps[st]) + (d.counts[st] ? ` <b>(${q.n}/${d.counts[st]})</b>` : '');
    return `<div class="q ${st === 99 ? 'qdone' : ''} ${S.tracked === id ? 'qtrack' : ''}" data-q="${id}"><div class="qt">${esc(d.title)}</div><div class="qg">From ${esc(d.giver)}</div><div class="qs">${step}</div>${st !== 99 && S.tracked !== id ? '<button class="small" data-track="' + id + '">TRACK</button>' : st !== 99 ? '<div class="qg">TRACKING</div>' : ''}</div>`; };
  const mains = QUEST_ORDER.filter(k => QUESTS[k].kind === 'main').map(row).join(''); const sides = QUEST_ORDER.filter(k => QUESTS[k].kind === 'side').map(row).join('');
  const found = QUEST_ORDER.filter(k => QUESTS[k].kind === 'side' && qStep(k) >= 0).length, total = QUEST_ORDER.filter(k => QUESTS[k].kind === 'side').length;
  showPanel(`<h2>QUEST LOG</h2><h3>Main Quests</h3>${mains || '<p class="dim">None yet.</p>'}<h3>Side Quests <span class="dim">(${found}/${total} found)</span></h3>${sides || '<p class="dim">Talk to people around Dripwater with a <b>!</b> over their heads.</p>'}`);
  document.querySelectorAll('[data-track]').forEach(b => b.onclick = () => { S.tracked = b.dataset.track; openQuests(); });
}
function itemIconURL(id) { const c = document.createElement('canvas'); c.width = c.height = 40; const g = c.getContext('2d'); drawItemIcon(g, id, 20, 21, 1.6); return c.toDataURL(); }
function kidPortraitURL(id) { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); g.fillStyle = '#1d1a33'; g.fillRect(0, 0, 64, 64); drawKid(g, id, 32, id === 'bloop' ? 42 : 72, 0, 1, 0, false, id === 'bloop' ? 1.7 : 2); return c.toDataURL(); }
function openBag(tab = 'party') {
  let body = '';
  if (tab === 'party') body = KID_ORDER.map(id => { const k = S.kids[id], d = KIDS[id]; if (!k.joined) return `<div class="kid locked"><div class="kn">???</div><p class="dim">Not found yet.</p></div>`; const st = stat(id);
    return `<div class="kid ${S.active === id ? 'act' : ''}"><img src="${kidPortraitURL(id)}"><div><div class="kn" style="color:${d.color}">${d.name} <span class="dim">LV ${S.level}</span></div><div class="ks">HP ${Math.ceil(k.hp)}/${st.hp} &middot; ATK ${st.atk} &middot; DEF ${st.def} &middot; SPD ${st.spd}</div><div class="kp"><b>${d.power}</b> / Special: <b>${d.special}</b></div><div class="dim">${d.desc}</div>${S.active !== id ? `<button class="small" data-play="${id}">PLAY AS ${d.name.toUpperCase()}</button>` : '<div class="qg">ACTIVE</div>'}</div></div>`; }).join('') + `<p class="dim">XP ${S.xp}/${xpNeed(S.level)} to next level &middot; ${S.bits} bits</p>`;
  else { const want = tab === 'items' ? ['use'] : ['relic', 'key']; const ids = Object.keys(S.inv).filter(id => S.inv[id] > 0 && ITEMS[id] && want.includes(ITEMS[id].type));
    body = ids.length ? ids.map(id => `<div class="item"><img src="${itemIconURL(id)}"><div><div class="kn">${ITEMS[id].name}${S.inv[id] > 1 ? ' x' + S.inv[id] : ''} <span class="tag">${ITEMS[id].type === 'use' ? '' : ITEMS[id].type.toUpperCase()}</span></div><div class="dim">${ITEMS[id].desc}</div></div>${ITEMS[id].type === 'use' ? `<button class="small" data-use="${id}">USE</button>` : ''}</div>`).join('') : '<p class="dim">Nothing here yet. Open chests and finish quests!</p>'; }
  showPanel(`<h2>BAG</h2><div class="tabs"><button data-tab="party" class="${tab === 'party' ? 'on' : ''}">PARTY</button><button data-tab="items" class="${tab === 'items' ? 'on' : ''}">ITEMS</button><button data-tab="relics" class="${tab === 'relics' ? 'on' : ''}">RELICS &amp; KEYS</button></div>${body}`);
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => openBag(b.dataset.tab));
  document.querySelectorAll('[data-use]').forEach(b => b.onclick = () => { useItem(b.dataset.use); openBag('items'); });
  document.querySelectorAll('[data-play]').forEach(b => b.onclick = () => { switchKid(b.dataset.play); openBag('party'); });
}
function openShop() {
  const ids = ['pizza', 'shake', 'hotsauce', 'taco'];
  showPanel(`<h2>CHEN'S CORNER MART</h2><p class="dim">You have <b style="color:#ffd166">${S.bits} bits</b>. Bits come from popping glitches and finishing quests.</p>` + ids.map(id => `<div class="item"><img src="${itemIconURL(id)}"><div><div class="kn">${ITEMS[id].name} <span class="dim">(have ${S.inv[id] || 0})</span></div><div class="dim">${ITEMS[id].desc}</div></div><button class="small" data-buy="${id}" ${S.bits < ITEMS[id].price ? 'disabled' : ''}>${ITEMS[id].price} bits</button></div>`).join('') +
    `<p class="dim">Want the real Glitch Kids books &amp; merch? <a href="${SHOP_URL}" target="_blank" rel="noopener">Visit the Zaynyg World shop</a>.</p>`);
  document.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => { const id = b.dataset.buy; if (S.bits >= ITEMS[id].price) { S.bits -= ITEMS[id].price; S.inv[id] = (S.inv[id] || 0) + 1; sfx('coin'); save(); } openShop(); });
}
function openMap() {
  showPanel(`<h2>MAP: ${esc(Zn.def.name.toUpperCase())}</h2><canvas id="bigmap"></canvas><p class="dim"><span style="color:#ffd166">&#9679;</span> Objective &nbsp; <span style="color:#fff">&#9679;</span> You &nbsp; <span style="color:#9be7ff">&#9679;</span> People &nbsp; <span style="color:#ff4d4d">&#9679;</span> Glitches</p><p class="dim">World: Dripwater (hub) &rarr; Glitch Woods (east road) &middot; Sewer Dimension (Zay's toilet) &middot; Data Caves (arcade cabinet) &middot; Dimension Pepperoni (school cafeteria)</p>`);
  const c = document.getElementById('bigmap'), m = Zn.map; const w = Math.min(560, innerWidth - 60); const s = w / m.w; c.width = w; c.height = Math.round(m.h * s); const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  g.drawImage(MINI[Zn.id], 0, 0, c.width, c.height); const k = s / TS;
  for (const n of npcList()) { g.fillStyle = '#9be7ff'; g.beginPath(); g.arc((n.x + 0.5) * s, (n.y + 0.5) * s, 3, 0, 7); g.fill(); }
  for (const e of enemies) { g.fillStyle = '#ff4d4d'; g.beginPath(); g.arc(e.x * k, e.y * k, e.boss ? 5 : 2, 0, 7); g.fill(); }
  g.font = 'bold 10px sans-serif'; g.fillStyle = '#fff'; g.textAlign = 'center'; for (const b of Zn.buildings) g.fillText(b.name, (b.x + b.w / 2) * s, (b.y + b.h / 2) * s);
  const tp = trackerPoint(); if (tp) { g.fillStyle = '#ffd166'; g.beginPath(); g.arc(tp.x * k, tp.y * k, 6, 0, 7); g.fill(); }
  g.fillStyle = '#fff'; g.beginPath(); g.arc(S.x * k, S.y * k, 5, 0, 7); g.fill(); g.fillStyle = KIDS[S.active].color; g.beginPath(); g.arc(S.x * k, S.y * k, 3, 0, 7); g.fill();
}
const HELP = `<h3>How to play</h3><p><b>Move:</b> joystick (left side of screen) or WASD / arrow keys<br><b>Attack:</b> big red button, J, Space or click (hold to keep attacking)<br><b>Special:</b> blue button or K (uses energy)<br><b>Swap kid:</b> SWAP button, Q / Tab, or tap a portrait<br><b>Talk / open / enter:</b> yellow USE button or E<br><b>Quests:</b> L &middot; <b>Bag:</b> I &middot; <b>Map:</b> M (or tap the minimap) &middot; <b>Menu:</b> Esc</p>
<p><b>Zay</b> shoots ketchup &amp; mustard (special: Turbo Plunge stuns). <b>Maya</b> smacks with her skateboard (special: Skate Dash). <b>Bloop</b> chomps and heals (special: Mega Burp). Follow the yellow arrow to your tracked quest. Pastor Grace at the chapel heals and saves.</p>`;
function openMenu() {
  showPanel(`<h2>PAUSED</h2><button class="big" id="mResume">RESUME</button><button class="big" id="mSave">SAVE GAME</button><button class="big" id="mSound">SOUND: ${G.sound ? 'ON' : 'OFF'}</button><a class="big shop" href="${SHOP_URL}" target="_blank" rel="noopener">SHOP ZAYNYG WORLD</a><button class="big" id="mQuit">QUIT TO TITLE</button>${HELP}<p class="dim">Played ${Math.floor(S.played / 60)} min &middot; Progress auto-saves.</p>`);
  document.getElementById('mResume').onclick = closePanel;
  document.getElementById('mSave').onclick = () => { save(); toast('Game saved!', '#7bf1a8'); closePanel(); };
  document.getElementById('mSound').onclick = () => { G.sound = !G.sound; try { localStorage.setItem('glitchkids_sound', G.sound ? '1' : '0'); } catch (e) {} openMenu(); };
  document.getElementById('mQuit').onclick = () => { save(); closePanel(); showTitle(); };
}
function showEnding() {
  G.state = 'menu'; burst(S.x, S.y, 80, ['#ff3df2', '#22d3ee', '#ffd166', '#7bf1a8']);
  showPanel(`<h2>THE END... FOR NOW</h2><p>Dripwater is saved! The toilets flush down, the homework stays on paper, and lunch has stopped fighting back.</p><p>But something is coming through the portal... and it smells like gym socks.</p>
  <p class="dim">Keep exploring to finish your side quests (${QUEST_ORDER.filter(k => QUESTS[k].kind === 'side' && qStep(k) === 99).length}/${QUEST_ORDER.filter(k => QUESTS[k].kind === 'side').length} done).</p>
  <p>Read the adventures that started it all: <b>The Glitch Kids</b> books by Jose Quinones.</p><a class="big shop" href="${SHOP_URL}" target="_blank" rel="noopener">GET THE BOOKS &amp; MERCH</a><button class="big" id="eCont">KEEP EXPLORING</button>`);
  document.getElementById('eCont').onclick = closePanel;
}

// ---------- title ----------
function showTitle() {
  G.state = 'title'; document.getElementById('title').classList.remove('hidden'); document.getElementById('dialog').classList.add('hidden');
  const s = loadSave(); const c = document.getElementById('tCont'); c.style.display = s ? '' : 'none';
  if (s) c.textContent = `CONTINUE (LV ${s.level} - ${ZONES[s.zone] ? ZONES[s.zone].name : ''})`;
}
function startGame(fromSave) {
  audio(); document.getElementById('title').classList.add('hidden');
  const s = fromSave ? loadSave() : null; S = s || freshState(); G.respawn = []; P.inv = 1;
  G.state = 'play'; enterZone(S.zone, 0, 0, true); S.x = s ? s.x : (ZONES.town.start[0] + 0.5) * TS; S.y = s ? s.y : (ZONES.town.start[1] + 0.5) * TS;
  if (blocked(S.x, S.y, 8)) { S.x = (ZONES[S.zone].start[0] + 0.5) * TS; S.y = (ZONES[S.zone].start[1] + 0.5) * TS; }
  banner = { text:Zn.def.name, t:2.6 };
  if (!s) dialog([say('narrator', 'Dripwater. A normal town where nothing weird ever happens.'), say('narrator', 'Except today, Zay\'s toilet is HUMMING. And there are bugs made of pixels on Maple Street.'),
    say('zay', 'Okay. Okay okay okay. This is either the coolest thing ever or the worst. Probably both.'), say('zay', 'I need my crew. Maya\'s at the skate park, and Bloop is... eating something gross somewhere.'),
    say('narrator', 'Follow the yellow arrow to your quest. Tap the big red button (or J / Space) to blast glitches!')], () => qStart('m1'));
  else save();
}
document.getElementById('tNew').onclick = () => { if (loadSave() && !confirm('Start a new game? Your saved progress will be replaced.')) return; startGame(false); };
document.getElementById('tCont').onclick = () => startGame(true);
document.getElementById('tHelp').onclick = () => { document.getElementById('helpBox').classList.toggle('hidden'); };
document.getElementById('helpBox').innerHTML = HELP;

// ---------- boot ----------
try { G.sound = localStorage.getItem('glitchkids_sound') !== '0'; } catch (e) {}
resize(); showTitle(); requestAnimationFrame(frame);

</script>
<script>
(function(){
  if (!window.ZWGate || !ZWGate.inHub) return;
  var LOCKED = ['m3','m4','m5'];
  var busy = false;
  function needLock(){
    if (ZWGate.allowed('glitch-kids')) return false;
    try { return LOCKED.some(function(id){ return S && S.Q && S.Q[id]; }); } catch(e){ return false; }
  }
  function doLock(){
    if (busy || !needLock()) return;
    busy = true;
    setTimeout(function(){
      if (!needLock()) { busy = false; return; }
      G.state = 'zwlock';
      ZWGate.lock('glitch-kids', 'Chapter 3 and beyond', function(){ busy = false; G.state = 'play'; });
    }, 700);
  }
  var _qs = qStart; qStart = function(id){ _qs(id); if (LOCKED.indexOf(id) >= 0) doLock(); };
  var _sg = startGame; startGame = function(a){ _sg(a); doLock(); };
})();
</script>
