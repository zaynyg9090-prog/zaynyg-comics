function beginFile(i,diff){G.noSave=false;const had=loadFile(i,diff);G.M=null;endBoss(false);for(const c of G.cars)c.dead=1;G.cars=[];G.mons=[];G.peds=[];G.picks=[];G.turrets=[];G.proj=[];G.eproj=[];for(const k in SPECIALS)SPECIALS[k]=null;for(const p of CITY.parked)p.car=null;for(const c of CITY.coins)c.got=0;
 saveGame();fadeOut(()=>{const s=CITY.LM.safe;resetPlayer(s.x,GY+0.1,s.z+3,0);G.state='play';G.district='';spawnSpecials();for(let i=0;i<40;i++)spawnPed(0,0,false);updateCam(0.016,true);musicNow();

function tick(dt){G.t+=dt;G.dt=dt;pollInput();

 updFade(dt);const st=G.state;

 else if(st==='files'){const a=menuInput();if(a==='back'){G.state='title';G.menu=0}else if(a==='erase'){G.erase=!G.erase}else if(a&&a[0]==='f'){const i=+a[1];if(G.erase){if(readFile(i)){eraseFile(i);toast('FILE '+'ABC'[i]+' ERASED','#ff8a8a');SND.sfx('poof')}G.erase=false}else if(readFile(i)){G.state='starting';beginFile(i)}else{G.pendFile=i;G.state='diff';G.menu=0}}}

 else if(st==='play'){G.playTime+=dt;if(G.endPending){G.endPending-=dt;if(G.endPending<=0){G.endPending=0;startEnding()}}if(IN.pauseP&&!G.fadeCB){G.state='pause';G.menu=0;SND.sfx('menu');SND.engine(-1)}else if(IN.mapP&&!G.fadeCB){G.state='map';SND.sfx('menu')}else{
   updatePlayer(dt);if(G.state==='play'){updateCars(dt);updateMonsters(dt);updatePeds(dt);updateTurrets(dt);updateProj(dt);updateEProj(dt);updateBoss(dt);updateWaves(dt);updatePicks(dt);updateMission(dt);updateWorld(dt);updParts(dt);updateCam(dt)}}
   G.saveT=(G.saveT||0)-dt;if(G.saveT<=0){G.saveT=15;saveGame()}}
 else if(st==='pause'){const a=menuInput();if(IN.pauseP||a==='res')G.state='play';else if(a==='map')G.state='map';else if(a==='mus')SND.toggle();else if(a==='quitm'){failMission('Mission cancelled. Talk to them again any time!');G.state='play'}else if(a==='quit'){saveGame();if(G.M){cleanupMission();G.M=null}fadeOut(()=>{G.state='title';G.menu=0;SND.play('title')},0.5)}}
