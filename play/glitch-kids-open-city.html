/* ---------- COLLISION ---------- */
function hitsSolid(x,y,r,hover){return solidAt(x-r,y-r,hover)||solidAt(x+r,y-r,hover)||solidAt(x-r,y+r,hover)||solidAt(x+r,y+r,hover);}
function moveCircle(e,dx,dy,r,hover){let hx=false,hy=false;if(!hitsSolid(e.x+dx,e.y,r,hover))e.x+=dx;else hx=true;if(!hitsSolid(e.x,e.y+dy,r,hover))e.y+=dy;else hy=true;return hx||hy;}
function freeSpotNear(x,y){if(!hitsSolid(x,y,7))return {x,y};for(let r=16;r<200;r+=12)for(let a=0;a<TAU;a+=0.6){const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;if(!hitsSolid(px,py,8))return {x:px,y:py};}return {x:LM.safe.x,y:LM.safe.y};}

function resetPlayer(full){const d=DIFFS[game.diff];P.maxhp=d.hp+game.maxBonus;P.hp=P.maxhp;P.inv=2;P.car=null;P.vx=P.vy=0;P.jump=0;P.dash=0;

function hurtPlayer(n,fx,fy){if(game.respawnT>0||P.inv>0||P.dash>0||P.jump>0)return;

 P.hp-=n;P.inv=1.4;SND.sfx('hurt');game.shake=8;burst(P.x,P.y,10,['#fff','#ffd23a'],140,3);
 if(fx!==undefined){const a=Math.atan2(P.y-fy,P.x-fx);P.vx+=Math.cos(a)*260;P.vy+=Math.sin(a)*260;}

function enterCar(c){if(c.ai){c.ai=0;const s=freeSpotNear(c.x+Math.cos(c.a+Math.PI/2)*22,c.y+Math.sin(c.a+Math.PI/2)*22);
  const p=newPed(s.x,s.y,'adult');p.wave=2.5;p.bub=pick(DRIVER_LINES);p.bt=3;peds.push(p);c.vx=Math.cos(c.a)*(c.spd||0);c.vy=Math.sin(c.a)*(c.spd||0);}
 c.park=0;P.car=c;SND.sfx('door');say('Hopped in: '+(VT[c.type].name||'Car')+'!','#3af0ff');}
function exitCar(){const c=P.car;if(!c)return;const s=freeSpotNear(c.x+Math.cos(c.a-Math.PI/2)*24,c.y+Math.sin(c.a-Math.PI/2)*24);P.x=s.x;P.y=s.y;P.car=null;c.park=1;SND.sfx('door');P.inv=0.5;}
function nearestCar(r){let best=null,bd=r;for(const c of cars){if(c.type==='robo'||c.type==='racer'||c.escort)continue;const d=Math.hypot(c.x-P.x,c.y-P.y)-VT[c.type].w/2;if(d<bd){bd=d;best=c;}}return best;}
function updatePlayer(dt){const H_=HEROES[P.hero];P.inv=Math.max(0,P.inv-dt);P.cd=Math.max(0,P.cd-dt);P.scd=Math.max(0,P.scd-dt);P.dash=Math.max(0,P.dash-dt);
 if(P.jump>0){P.jump-=dt;if(P.jump<=0){P.jump=0;burst(P.x,P.y+6,6,['#8fd0ff','#fff'],80,2);}}
 if(inp.swap)swapGad();
 if(P.car){driveCar(P.car,dt,true);P.x=P.car.x;P.y=P.car.y;if(inp.ent)exitCar();else if(inp.spec&&P.scd<=0){P.car.boost=1.2;P.scd=3;SND.sfx('dash');}
  if(inp.atkP&&P.car&&false)fire();return;}
 let mx=inp.mx,my=inp.my;const m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m;}
 const tile=tileAtP(P.x,P.y);let spd=H_.spd*(tile===TSLUDGE?0.6:1)*(P.dash>0?2.7:1);
 const tvx=mx*spd,tvy=my*spd,k=Math.min(1,(P.dash>0?3:14)*dt);P.vx=lerp(P.vx,tvx,k);P.vy=lerp(P.vy,tvy,k);
 moveCircle(P,P.vx*dt,P.vy*dt,7);P.x=clamp(P.x,40,MW*T-40);P.y=clamp(P.y,40,MH*T-40);
 if(m>0.2){P.face=Math.atan2(my,mx);P.walk+=dt*m*10;}
 if(P.dash>0&&rnd()<0.6)parts.push({x:P.x,y:P.y,vx:0,vy:0,life:0.25,max:0.25,c:H_.c,type:'ghost',a:P.face});
 if(inp.atk&&P.cd<=0)fire();
 if(inp.spec&&P.scd<=0)special();
 if(inp.ent){const c=nearestCar(26);if(c)enterCar(c);}
 if(inp.talk)talk();
 // hide in bushes
 P.hidden=(tile===TBUSH)?1:0;}
function special(){const H_=HEROES[P.hero];P.scd=H_.cd;
 if(P.hero===0){P.dash=0.32;P.inv=Math.max(P.inv,0.35);SND.sfx('dash');const a=P.face;P.vx=Math.cos(a)*360;P.vy=Math.sin(a)*360;}
 else if(P.hero===1){turrets.push({x:P.x+Math.cos(P.face)*18,y:P.y+Math.sin(P.face)*18,life:8,cd:0,a:0});SND.sfx('ok');say('Maya: Turret deployed!','#2fd3a0');}
 else {P.jump=0.7;SND.sfx('jump');}}
function swapGad(){for(let i=1;i<=8;i++){const n=(P.gad+i)%8;if(P.unl[n]){P.gad=n;SND.sfx('sel');say(GADS[n].n,GADS[n].c);return;}}}
function allTargets(){const a=mons.slice();if(boss&&boss.hp>0&&!boss.dead)a.push(boss);for(const c of cars)if(c.type==='robo'&&c.hp>0)a.push(c);return a;}
function autoAim(x,y,face,range){let best=null,bs=1e9;for(const t of allTargets()){const dx=t.x-x,dy=t.y-y,d=Math.hypot(dx,dy);if(d>range)continue;let da=Math.abs(((Math.atan2(dy,dx)-face)+Math.PI*3)%TAU-Math.PI);if(da>1.0)continue;const s=d+da*120;if(s<bs){bs=s;best=t;}}return best;}
function fire(){const g=GADS[P.gad];if(g.max&&P.ammo[P.gad]<=0){say('Out of '+g.n+' ammo! Press SWAP.','#ff9a3a');P.cd=0.5;swapGad();return;}
 P.cd=g.cd;if(g.max)P.ammo[P.gad]--;const tg=autoAim(P.x,P.y,P.face,g.lob?300:260);let a=P.face;if(tg)a=Math.atan2(tg.y-P.y,tg.x-P.x);SND.sfx(g.t);
 if(g.melee){parts.push({x:P.x,y:P.y,life:0.18,max:0.18,type:'swing',a,c:g.c});for(const t of allTargets()){const d=Math.hypot(t.x-P.x,t.y-P.y);if(d<44+(t.r||10)){let da=Math.abs(((Math.atan2(t.y-P.y,t.x-P.x)-a)+Math.PI*3)%TAU-Math.PI);if(da<1.4||d<20)damageTarget(t,g.dmg,{knock:a});}}game.shake=Math.max(game.shake,3);return;}
 if(g.lob){let tx,ty;if(tg){tx=tg.x;ty=tg.y;}else{tx=P.x+Math.cos(a)*170;ty=P.y+Math.sin(a)*170;}shots.push({x:P.x,y:P.y,sx:P.x,sy:P.y,tx,ty,t:0,dur:g.lob,g,lob:1,z:0});return;}
 shots.push({x:P.x+Math.cos(a)*10,y:P.y+Math.sin(a)*10,vx:Math.cos(a)*g.spd,vy:Math.sin(a)*g.spd,life:g.life,g,a,hit:new Set(),ret:g.ret?1:0,phase:0,spin:0});}
function damageTarget(t,dmg,o){o=o||{};if(t.boss){if(t.shield>0){popText(t.x,t.y-t.r,'BLOCKED!','#9ab');SND.sfx('hit');return;}t.hp-=dmg;t.flash=0.12;SND.sfx('hit');popText(t.x+R(-10,10),t.y-t.r,'-'+dmg,'#ffd23a');if(t.hp<=0)bossDefeated();return;}
 if(t.type&&VT[t.type]){damageCar(t,dmg);return;}
 t.hp-=dmg;t.flash=0.12;SND.sfx('hit');if(o.freeze)t.frz=o.freeze;if(o.stun)t.stun=o.stun;if(o.slow)t.slow=o.slow;
 if(o.knock!==undefined){t.kx=Math.cos(o.knock)*200;t.ky=Math.sin(o.knock)*200;}
 if(t.hp<=0&&!t.dead)killMon(t);}
function killMon(m){m.dead=1;SND.sfx('poof');confetti(m.x,m.y,22);const d=MT[m.type];addScore(d.pts);popText(m.x,m.y-12,'+'+d.pts,'#fff');
 for(let i=0;i<d.coin;i++)picks.push({x:m.x+R(-10,10),y:m.y+R(-10,10),t:'coin',life:14,vy:R(-60,-20),vx:R(-50,50)});
 const r=rnd();if(r<0.16)picks.push({x:m.x,y:m.y,t:'ammo',life:14});else if(r<0.22)picks.push({x:m.x,y:m.y,t:'heart',life:14});else if(r<0.225)picks.push({x:m.x,y:m.y,t:'1up',life:20});
 game.chaos=Math.max(0,game.chaos-1.5);if(M&&M.d.onKill)M.d.onKill(M,m);}
/* ---------- SHOTS ---------- */
function shotHit(s,t){const g=s.g;damageTarget(t,g.dmg,{freeze:g.freeze,stun:g.stun,slow:g.slow});
 if(g.chain){let n=null,nd=110;for(const o of allTargets()){if(o===t||o.dead)continue;const d=dist(o,t);if(d<nd){nd=d;n=o;}}if(n){parts.push({x:t.x,y:t.y,x2:n.x,y2:n.y,life:0.2,max:0.2,type:'bolt',c:'#fff04a'});damageTarget(n,1,{});}}
 burst(s.x,s.y,6,[g.c,'#fff'],120,2);}
function explode(x,y,g){game.shake=Math.max(game.shake,g.splash>60?7:4);parts.push({x,y,life:0.4,max:0.4,type:'ring',c:g.c,r:g.splash});
 burst(x,y,g.t==='mor'?40:18,g.t==='mor'?CONF:['#ffb43a','#ffe08a','#e23b2e'],g.splash*4,3);
 for(const t of allTargets()){if(Math.hypot(t.x-x,t.y-y)<g.splash+(t.r||10))damageTarget(t,g.dmg,{});}}
function updateShots(dt){for(const s of shots){const g=s.g;
  if(s.lob){s.t+=dt/s.dur;const k=Math.min(1,s.t);s.x=lerp(s.sx,s.tx,k);s.y=lerp(s.sy,s.ty,k);s.z=Math.sin(k*Math.PI)*60;if(s.t>=1){explode(s.x,s.y,g);s.dead=1;}continue;}
  s.spin+=dt*20;
  if(s.ret){s.phase+=dt;if(s.phase>g.life){const a=Math.atan2(P.y-s.y,P.x-s.x);s.vx=lerp(s.vx,Math.cos(a)*g.spd*1.2,Math.min(1,dt*10));s.vy=lerp(s.vy,Math.sin(a)*g.spd*1.2,Math.min(1,dt*10));if(Math.hypot(P.x-s.x,P.y-s.y)<16)s.dead=1;if(s.phase>2.5)s.dead=1;}
   if(s.phase>g.life*0.5&&s.hit.size>50)s.hit.clear();}
  else{s.life-=dt;if(s.life<=0){s.dead=1;if(g.t==='bub')burst(s.x,s.y,6,['#cff4ff','#fff'],80,2);}}
  s.x+=s.vx*dt;s.y+=s.vy*dt;
  if(!s.ret&&g.t!=='boom'&&solidAt(s.x,s.y,true)){s.dead=1;burst(s.x,s.y,5,[g.c],90,2);continue;}
  for(const t of allTargets()){if(t.dead||s.hit.has(t))continue;if(Math.hypot(t.x-s.x,t.y-s.y)<(t.r||12)+g.r){s.hit.add(t);shotHit(s,t);if(!s.ret){s.dead=1;break;}}}}
 shots=shots.filter(s=>!s.dead);
 for(const e of eshots){e.life-=dt;e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.acc){e.vx*=1+e.acc*dt;e.vy*=1+e.acc*dt;}e.spin=(e.spin||0)+dt*8;
  if(e.life<=0||(!e.ghost&&solidAt(e.x,e.y,true))){e.dead=1;continue;}
  if(e.drop){e.drop-=dt;if(e.drop<=0){e.dead=1;parts.push({x:e.x,y:e.y,life:0.3,max:0.3,type:'ring',c:e.c,r:e.r*2.2});if(Math.hypot(P.x-e.x,P.y-e.y)<e.r*2.2)hurtPlayer(1,e.x,e.y);game.shake=4;}continue;}
  if(Math.hypot(P.x-e.x,P.y-e.y)<e.r+7){e.dead=1;hurtPlayer(1,e.x,e.y);}
  if(e.targ&&!e.targ.dead&&Math.hypot(e.targ.x-e.x,e.targ.y-e.y)<e.r+16){e.dead=1;damageCar(e.targ,1);}}
 eshots=eshots.filter(e=>!e.dead);
 for(const t of turrets){t.life-=dt;t.cd-=dt;const tg=autoAim(t.x,t.y,t.a,240)||(()=>{let b=null,bd=240;for(const o of allTargets()){const d=Math.hypot(o.x-t.x,o.y-t.y);if(d<bd){bd=d;b=o;}}return b;})();
  if(tg){t.a=Math.atan2(tg.y-t.y,tg.x-t.x);if(t.cd<=0){t.cd=0.32;shots.push({x:t.x,y:t.y,vx:Math.cos(t.a)*380,vy:Math.sin(t.a)*380,life:0.7,g:{...GADS[0],dmg:1,c:'#2fd3a0'},hit:new Set(),phase:0,spin:0});SND.sfx('goo');}}else t.a+=dt;
  if(t.life<=0)confetti(t.x,t.y,10);}
 turrets=turrets.filter(t=>t.life>0);}
function eShot(x,y,a,spd,c,o){eshots.push(Object.assign({x,y,vx:Math.cos(a)*spd*DIFFS[game.diff].es,vy:Math.sin(a)*spd*DIFFS[game.diff].es,life:4,r:6,c},o||{}));}

/* ---------- MONSTERS ---------- */
function spawnMon(type,x,y,o){const d=MT[type];const m=Object.assign({type,x,y,hp:d.hp,r:d.r,frz:0,stun:0,slow:0,kx:0,ky:0,t:rnd()*9,flash:0,cd:R(1,3)},o||{});mons.push(m);
 parts.push({x,y,life:0.4,max:0.4,type:'ring',c:d.c,r:20});return m;}
function updateMons(dt){const es=DIFFS[game.diff].es;
 for(const m of mons){if(m.dead)continue;const d=MT[m.type];m.t+=dt;m.flash=Math.max(0,m.flash-dt);
  if(m.kx||m.ky){moveCircle(m,m.kx*dt,m.ky*dt,m.r*0.7,d.fly);m.kx*=Math.max(0,1-8*dt);m.ky*=Math.max(0,1-8*dt);if(Math.abs(m.kx)<5)m.kx=0;if(Math.abs(m.ky)<5)m.ky=0;}
  if(m.frz>0){m.frz-=dt;continue;}if(m.stun>0){m.stun-=dt;continue;}if(m.slow>0)m.slow-=dt;
  let tg=m.targ&&!m.targ.dead?m.targ:P;const dx=tg.x-m.x,dy=tg.y-m.y,dd=Math.hypot(dx,dy)||1;
  const aggro=m.mis?2000:(170+stars()*45+(P.hidden?-110:0));let vx=0,vy=0,sp=d.spd*es*(m.slow>0?0.45:1);
  if(dd<aggro&&game.respawnT<=0){vx=dx/dd*sp;vy=dy/dd*sp;if(d.zig){const z=Math.sin(m.t*7)*0.9;vx+=-dy/dd*sp*z;vy+=dx/dd*sp*z;}}
  else{if(!m.wa||m.t>m.wt){m.wa=rnd()*TAU;m.wt=m.t+R(1,3);}vx=Math.cos(m.wa)*sp*0.4;vy=Math.sin(m.wa)*sp*0.4;}

function dropSpot(cx,cy,rmin,rmax){for(let k=0;k<300;k++){const s=randomWalkNear(cx,cy,rmin,rmax,(t,d)=>t===TWALK&&(d===0));if(!s)continue;const tx=Math.floor(s.x/T),ty=Math.floor(s.y/T);
  if([[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>tAt(tx+a,ty+b)===TROAD))return s;}return randomWalkNear(cx,cy,rmin,rmax)||{x:cx,y:cy};}
function laneSpotNear(x,y,r){for(let k=0;k<200;k++){const i=RI(0,7),j=RI(0,6),n=nodeXY(i,j);const d=RI(0,3),off=R(4,11)*T;let px=n.x,py=n.y,lane;
  if(d===0){py=n.y+T/2;px=n.x+off;lane=py;}else if(d===2){py=n.y-T/2;px=n.x-off;lane=py;}else if(d===1){px=n.x-T/2;py=n.y+off;lane=px;}else{px=n.x+T/2;py=n.y-off;lane=px;}
  if(Math.hypot(px-x,py-y)>r||tileAtP(px,py)!==TROAD||distA2(px,py)===4)continue;return {x:px,y:py,d,lane};}return null;}
function pathOf(nodes){return nodes.map(([i,j])=>nodeXY(i,j));}
function kinMove(c,path,spd,dt){if(c.pi>=path.length)return true;const tg=path[c.pi];const dx=tg.x-c.x,dy=tg.y-c.y,d=Math.hypot(dx,dy);
 if(d<spd*dt+1){c.x=tg.x;c.y=tg.y;c.pi++;return c.pi>=path.length;}c.x+=dx/d*spd*dt;c.y+=dy/d*spd*dt;const ta=Math.atan2(dy,dx);let da=((ta-c.a)+Math.PI*3)%TAU-Math.PI;c.a+=da*Math.min(1,dt*7);c.spd=spd;return false;}

const THANKS={tony:"Grazie, Glitch Kids! Free slice any time!",rita:"The ducks say quack-you very much!",pat:"Drive safe out there, hero!",pip:"Pipes are flowing smooth thanks to you!",rae:"Rematch someday? Ha! You'd win again.",swirl:"Sprinkles for life, kiddo!",byte:"The Wi-Fi has never been faster!",pickles:"Remember: always do your homework!",maya:"Best team ever. Glitch Kids forever!"};
function placeGivers(){peds=peds.filter(p=>!p.giver);for(const k in GIVERS){const g=GIVERS[k],p=g.p();const ped=newPed(p.x,p.y,g.look);ped.giver=k;ped.name=g.n;peds.push(ped);}}
function giverHasMission(k){return !M&&game.mIdx<MDEF.length&&MDEF[game.mIdx].giver===k;}
function openGiver(ped){const k=ped.giver,g=GIVERS[k];
 if(M){openDialog(g.n,[M.d.giver===k?"You're already on my mission! Go go go!":"Finish your current mission first, hero!"]);return;}
 if(giverHasMission(k)){const d=MDEF[game.mIdx];openDialog(g.n,d.intro.concat(['Will you help? ']),{choice:true,onYes:()=>startMission(game.mIdx)});return;}
 const done=MDEF.some((d,i)=>d.giver===k&&i<game.mIdx);openDialog(g.n,[done?THANKS[k]:"Hey there! I might need help later. Check your map for a '!' to find who needs you now."]);}
function startMission(i){const d=MDEF[i];M={i,d,t:0,stage:0,timer:0,data:{}};if(d.start)d.start(M);
 if(d.boss){M.stage=0;if(d.boss==='emperor'){game.flags.pep=1;setBarrier(false);}}
 banner(d.title,'MISSION '+(i+1)+' of '+MDEF.length,'#3af0ff');SND.sfx('ok');}
function updateMission(dt){if(!M)return;M.t+=dt;if(M.timer>0){M.timer-=dt;if(M.timer<=0){M.timer=0;failMission("Time's up! Talk to them again to retry.");return;}}
 let r;if(M.d.boss){const a=LM[M.d.arena];if(!boss&&!M.data.done&&Math.hypot(P.x-a.x,P.y-a.y)<380)spawnBoss(M.d.boss,a.x,a.y-40);if(M.data.done){M.data.wt=(M.data.wt||0)+dt;if(M.data.wt>1.8)r='win';}}
 else r=M.d.update(M,dt);if(r==='win'&&M)winMission();}
function missionTarget(){if(!M)return null;if(M.d.boss)return boss&&!boss.dead?boss:LM[M.d.arena];return M.d.target(M);}
function missionHud(){if(!M)return '';if(M.d.boss)return boss?(M.data.done?'BOSS DEFEATED!':'Defeat '+BDEF[M.d.boss].name+'!'):'Go to the boss arena! Follow the arrow';return M.d.hud(M);}
function cleanupMission(){for(const x of mons)if(x.mis||x.bm)x.dead=1;mons=mons.filter(x=>!x.dead);cars=cars.filter(c=>!c.mis);picks=picks.filter(k=>!k.mis);eshots=[];boss=null;SND.play('city');}
function winMission(){const d=M.d,i=M.i;cleanupMission();M=null;game.mIdx=Math.max(game.mIdx,i+1);const rw=d.reward||{};
 game.coins+=rw.coins||0;addScore(2000+(rw.coins||0)*2);let extra=[];
 if(rw.gad!==undefined&&!P.unl[rw.gad]){P.unl[rw.gad]=1;P.ammo[rw.gad]=GADS[rw.gad].max;P.gad=rw.gad;extra.push('NEW GADGET: '+GADS[rw.gad].n+'!');}
 if(rw.hover){game.hoverHome=true;placeSpecials();for(const s of specials)s.car=cars.find(c=>c.type===s.t&&Math.hypot(c.x-s.p.x,c.y-s.p.y)<40&&!c.dead)||null;extra.push('HOVER-BIKE unlocked at the Safe House!');}
 if(rw.pep){game.flags.pep=1;setBarrier(false);extra.push('The portal to DIMENSION PEPPERONI is open!');}
 SND.sfx('win');banner('MISSION COMPLETE!','+'+(rw.coins||0)+' coins','#7dff4a');saveGame();
 if(d.final){game.state='ending';game.endT=0;SND.play('end');saveGame(true);return;}
 openDialog(GIVERS[d.giver].n,[d.win].concat(extra));}
function failMission(msg){if(!M)return;cleanupMission();M=null;banner('MISSION FAILED',msg,'#ff5a5a');SND.sfx('fail');}

function spawnBoss(k,x,y){const d=BDEF[k],hm=[0.7,1,1.3][game.diff];boss={boss:1,k,name:d.name,x,y,hx:x,hy:y,hp:Math.round(d.hp*hm),max:Math.round(d.hp*hm),r:d.r,t:0,at:2.2,ai:0,shield:0,flash:0,st:'move',stt:0,dx:0,dy:0,heartT:12,ang:0};

function bossMinion(type,n){for(let i=0;i<n;i++){const s=randomWalkNear(boss.x,boss.y,50,140);if(s)spawnMon(type,s.x,s.y,{bm:1});}}

 const dx=P.x-b.x,dy=P.y-b.y,dd=Math.hypot(dx,dy)||1,aP=Math.atan2(dy,dx),low=b.hp<b.max*0.5;
 b.heartT-=dt;if(b.heartT<=0&&game.diff<2){b.heartT=14;const s=randomWalkNear(b.hx,b.hy,80,200);if(s)picks.push({x:s.x,y:s.y,t:rnd()<0.5?'heart':'ammo',life:14,mis:1});}
 let sp=BDEF[b.k].spd*es;if(b.st==='dash'){sp=0;moveCircle(b,b.dx*dt,b.dy*dt,b.r*0.6,b.k==='exam');if(b.stt<=0)b.st='move';}
 else if(b.st==='lag'){sp=0;if(b.stt<=0){b.st='dash';b.stt=0.8;b.dx=Math.cos(aP)*300*es;b.dy=Math.sin(aP)*300*es;}}
 if((b.st==='move'||b.st==='buf')&&dd>b.r+30){let vx=dx/dd*sp,vy=dy/dd*sp;if(b.k==='exam'){vx+=Math.cos(b.t*1.3)*40;vy+=Math.sin(b.t*1.7)*30;}moveCircle(b,vx*dt,vy*dt,b.r*0.6,b.k==='exam');}
 const hd=Math.hypot(b.x-b.hx,b.y-b.hy);if(hd>280){b.x=lerp(b.x,b.hx,dt*2);b.y=lerp(b.y,b.hy,dt*2);}
 if(dd<b.r+8)hurtPlayer(1,b.x,b.y);
 b.at-=dt;
 if(b.k==='clog'){if(b.at<=0){b.ai++;b.at=(low?1.9:2.6)/es;const ph=b.ai%3;
   if(ph===0){const n=low?16:11;for(let i=0;i<n;i++)eShot(b.x,b.y,i/n*TAU+b.t,110,'#7dff4a',{r:8});SND.sfx('goo');}

   else{b.st='dash';b.stt=0.6;b.dx=Math.cos(aP)*260*es;b.dy=Math.sin(aP)*260*es;game.shake=6;}}}
 else if(b.k==='buffer'){if(b.st==='move'){b.st='buf';b.shield=1;b.stt=3.2;if(low)bossMinion('byte',2);}
  if(b.st==='buf'){b.ang+=dt*8;if(b.at<=0){b.at=0.9/es;for(let i=-1;i<=1;i++)eShot(b.x,b.y,aP+i*0.3,150,'#3af0ff',{r:6});SND.sfx('ebolt');}
   if(b.stt<=0){b.st='lag';b.shield=0;b.stt=2.6/es+0.5;popText(b.x,b.y-40,'LAG!!','#ffd23a');SND.sfx('hit');}}}
 else if(b.k==='exam'){if(b.at<=0){b.ai++;b.at=(low?1.4:2.1)/es;const ph=b.ai%3;
   if(ph===0){for(let i=-2;i<=2;i++)eShot(b.x,b.y,aP+i*0.22,170,'#ffd23a',{r:5,pencil:1});SND.sfx('ebolt');}
   else if(ph===1){for(let i=0;i<(low?5:3);i++){const a=rnd()*TAU,r=R(0,90);eshots.push({x:P.x+Math.cos(a)*r,y:P.y+Math.sin(a)*r,vx:0,vy:0,life:2,r:14,c:'#ff5a5a',drop:1.2,ghost:1,letter:'F'});}popText(b.x,b.y-40,'F!','#ff5a5a');}
   else{bossMinion('bug',2);popText(b.x,b.y-40,'POP QUIZ!','#ff4fd8');}}}
 else if(b.k==='emperor'){const ph=b.hp>b.max*0.6?0:b.hp>b.max*0.3?1:2;

function debugKeys(){for(let n=0;n<10;n++)if(kp['Digit'+n]){jumpMission(n===0?9:n-1);return;}
 if(kp.KeyB&&boss)boss.hp=1;if(kp.KeyG){P.unl=[1,1,1,1,1,1,1,1];P.ammo=GADS.map(g=>g.max);game.coins+=5000;say('DEBUG: all gadgets + 5000 coins','#7dff4a');}
 if(kp.KeyT){const t=missionTarget();if(t){if(P.car)exitCar();const s=freeSpotNear(t.x,t.y+60);P.x=s.x;P.y=s.y;updateCam(0,true);}}if(kp.KeyL)game.day=(game.day+0.5)%1;}
let tcam={a:0};
function titleWorld(dt){tcam.a+=dt*0.05;const cx=MW*T*0.45+Math.cos(tcam.a)*900,cy=MH*T*0.42+Math.sin(tcam.a*1.3)*600;P.x=cx;P.y=cy;P.car=null;game.respawnT=1;game.day=(game.day+dt/60)%1;
 if(Math.floor(game.t*2)!==Math.floor((game.t-dt)*2)){trafficSpawn();pedSpawn();}updateCars(dt);updatePeds(dt);updateParts(dt);updateCam(dt);}
function render(){X.setTransform(1,0,0,1,0,0);const st=game.state;
 if(st==='ending'){drawEnding();return;}
 renderWorld();X.setTransform(1,0,0,1,0,0);
 if(st==='title'){hitRects=[];drawTitle();return;}
 if(st==='howto'){drawHowTo();hitRects=[];return;}
 drawHUD();
 if(game.respawnT>0&&st==='play'){}
 if(st==='map')drawFullMap();
 else if(st==='menu'){hitRects=[];drawMenu();}
 else if(st==='dialog')drawDialog();
 else if(st==='over'){hitRects=[];drawOver();}}
let last=performance.now(),acc=0;
function loop(now){let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;if(dt<0)dt=0;
 try{update(dt);render();}catch(e){console.error(e);if(!window.__gkErr){window.__gkErr=String(e&&e.stack||e);}}
 endInput();requestAnimationFrame(loop);}
function boot(){makeTiles();genWorld();setBarrier(true);buildMini();initCars();placeGivers();const sv=store.get(SAVEKEY,null);if(sv&&sv.diff!==undefined)game.diff=sv.diff;
 if(/[?&]debug/.test(location.search))game.dbg=true;P.x=MW*T/2;P.y=MH*T/2;updateCam(0,true);game.state='title';SND.play('title');requestAnimationFrame(loop);}
boot();
</script>
