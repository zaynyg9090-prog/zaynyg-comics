  if(form==='W'){drawHumanoid(h.Wr,x,j,z,yaw,{walk:0.5,ph:G.endT*8+i,armUp:-2.6});draw(h.Wx,M4.trs(x,j,z,yaw,0,0,h.Wr.s))}else drawHeroAt(h,form,x,form==='S'?0:j*0.5,z,yaw+(form==='V'?G.endT:0),{unf:0.55},form==='S'?0.55:1);drawShadow(x,j,z,0.8)})})}
function hudEnding(){const u=Math.min(W,H)/100;logo(W/2,H*0.12,u*4.5);const y0=H*0.95-G.endT*u*5.2;CREDITS.forEach((s,i)=>{const y=y0+i*u*5.2+H*0.12;if(y>H*0.36&&y<H*0.92){X.globalAlpha=clamp(Math.min((y-H*0.36)/(H*0.08),(H*0.92-y)/(H*0.06)),0,1);txt(s,W/2,y,i===0?u*3.6:u*2.8,i===0?'#ffd23a':'#fff','center')}});X.globalAlpha=1;
 txt('Missions 9 / 9  ·  Star Shards '+G.shards.size+' / 7  ·  Bolts '+G.bolts+'  ·  '+Math.floor(G.playTime/60)+'m'+String(Math.floor(G.playTime%60)).padStart(2,'0')+'s',W/2,H*0.31,u*2.4,'#ffd23a','center');if(G.endT>6)txt(TOUCH?'tap to continue':'press any button',W/2,H-u*5,u*2.2,'#fff','center')}
/* ---------- main loop ---------- */
let last=0;
function pickFile(i){G.slot=i;const s=loadSlot(i);G.prog=s?s.prog||0:0;G.bolts=s?s.bolts||0:0;G.shards=new Set(s?s.shards||[]:[]);G.ended=s?!!s.ended:false;G.playTime=s?s.t||0:0;P.hero=s&&unlockedFor(G.prog).includes(s.hero)?s.hero:0;
 SND.resume();G.state='starting';fadeOut(()=>{G.L.items.forEach(it=>{if(it.k==='bolt'||it.k==='heart')it.got=false});startPlay();save();
  if(!s)story([['Mayor Penny Moss','Help! The gray Stilltime gloom is spreading over Tinkerbrook. Colors, laughs and songs are fading away!'],['Nova Reyes','Not on our watch! TINK, SPARK UP!'],['TINK','*wind-chime laugh* KLIK-KLAK-KSHOOM!'],['Nova Reyes',TOUCH?'Left thumb moves. A jumps (tap again on landing for a bigger jump!). B hits and talks. ⟲ MORPHs vehicle/warrior. ⌂ UNFOLDs the playset. ★ is my SKILL. Drag the right side to look around.':'WASD/arrows move. Space jumps (jump again right as you land for a BIGGER jump). J hits and talks. K MORPHs vehicle/warrior. L UNFOLDs the playset. U or Shift is my SKILL. Q/E or mouse-drag turn the camera, R recenters.'],['Nova Reyes','Follow the gold ★ arrow to the next friend who needs help. Let\'s bring the color back!']])},0.6)}
function unlockedFor(p){const o=G.prog;G.prog=p;const u=unlocked();G.prog=o;return u}
function tick(dt){G.t+=dt;G.dt=dt;pollInput();
 if(DEBUG&&IN.tapP&&IN.tap&&G.state==='play'&&dbgClick(IN.tap)){clearInput();return}
 updFade(dt);
 if(G.state==='title'){const a=menuInput();if(a==='start'){G.state='files';G.menu=0;G.erase=false;SND.sfx('ok');SND.play('file')}else if(a==='mus')SND.toggle()}
 else if(G.state==='files'){const a=menuInput();if(IN.backP||a==='back'){G.state='title';G.menu=0;SND.play('title')}else if(a==='erase'){G.erase=!G.erase;SND.sfx('menu')}else if(a&&a[0]==='f'){const i=+a[1];if(G.erase){eraseSlot(i);G.erase=false;SND.sfx('poof');toast('File '+'ABC'[i]+' erased')}else{SND.sfx('ok');pickFile(i)}}}
 else if(G.state==='play'){G.playTime+=dt;if(G.endPending){G.endPending-=dt;if(G.endPending<=0){G.endPending=0;startEnding()}}
  if(IN.pauseP&&!G.fadeCB){G.state='pause';G.menu=0;SND.sfx('menu')}else{if(G.M&&G.M.active&&G.M.go>0){IN.mx=IN.mz=0;IN.jumpP=IN.atkP=IN.morphP=IN.setP=IN.skP=false}
   updatePlayer(dt);updateEnemies(dt);updateWorld(dt);if(G.boss)G.boss.update(dt);updMission(dt);updateProj(dt);updateWaves(dt);updParts(dt);updateCam(dt);if(G.t-(G.lastSave||0)>20){G.lastSave=G.t;save()}}}
 else if(G.state==='pause'){const a=menuInput();if(IN.pauseP||IN.backP||a==='res')G.state='play';else if(a==='quitm'){G.state='play';missionFail('Mission paused. Come back any time!')}else if(a==='rec'){G.state='play';G.cam.recT=0.4}else if(a==='mus')SND.toggle();else if(a==='title'){save();if(G.M&&G.M.active)endMission();G.boss=null;G.state='title';G.menu=0;SND.play('title')}}
 else if(G.state==='dlg'){updParts(dt);if(IN.okP||IN.tapP||IN.atkP||IN.jumpP){const d=G.dlg;d.i++;SND.sfx('menu');if(d.i>=d.lines.length){G.dlg=null;G.state='play';if(d.cb)d.cb()}}}
 else if(G.state==='ending'){updParts(dt);updEnding(dt)}
 clearInput()}
function render(){X.clearRect(0,0,W,H);
 if(G.state==='title'||G.state==='files'||G.state==='starting'){const a=G.t*0.08;renderScene([5+Math.sin(a)*60,26+Math.sin(G.t*0.2)*5,10+Math.cos(a)*60],[5,2,0],()=>{gl.uniform1f(U.uSat,1);HEROES.forEach((h,i)=>{const x=-2.5+i*3,z=14;const form=['W','V','W','V','W','W'][i];drawHeroAt(h,form,x,0,z,Math.atan2(Math.sin(a)*60-x+5,10+Math.cos(a)*60-z),{walk:0.3,ph:G.t*3+i,armUp:i%2?-0.4:0});if(form==='W')draw(h.Wx,M4.trs(x,0,z,Math.atan2(Math.sin(a)*60-x+5,10+Math.cos(a)*60-z),0,0,h.Wr.s));drawShadow(x,0,z,0.8)})});if(G.state!=='starting')hudTitle()}
 else if(G.state==='ending'){renderEnding();hudEnding()}
 else{const c=G.cam;renderScene([c.x,c.y,c.z],[c.tx,c.ty,c.tz]);if(G.state==='play')hudPlay();if(G.state==='dlg'){hudPlay();hudDlg()}if(G.state==='pause')hudPause()}
 hudCommon()}
function frame(ts){const dt=Math.min(0.05,Math.max(0.001,(ts-last)/1000||0.016));last=ts;try{if(!G.manual)tick(dt);if(!G.freeze)render()}catch(e){console.error(e);G.err=String(e&&e.stack||e)}requestAnimationFrame(frame)}
function init(){buildHeroes();buildEnemies();loadTown();G.clouds=[];for(let k=0;k<14;k++)G.clouds.push({x:rnd(-120,120),y:rnd(30,50),z:rnd(-120,120),s:rnd(2,4),v:rnd(0.5,1.5)});
 G.prog=0;applyProgress();G.sat=G.satT.slice();G.state='title';SND.play('title');HC.focus();requestAnimationFrame(frame)}
/* ---------- debug / test API ---------- */
const MMM={G,P,HEROES,MISSIONS,SHARDS,
 file(i){pickFile(i||0)},
 mission(i){if(G.M&&G.M.active)endMission();G.boss=null;G.prog=i;applyProgress();G.sat=G.satT.slice();G.state='play';const g=giverOf(i);resetPlayer(g.x+Math.sin(g.yaw)*2.5,0.2,g.z+Math.cos(g.yaw)*2.5,g.yaw+Math.PI);startMission(i);G.dlg.i=G.dlg.lines.length-1;return MISSIONS[i].id},
 win(){if(G.M&&G.M.active){missionWin();return true}return false},
 kill(){const b=G.boss;if(!b||!b.alive)return false;if(b.pist)b.pist.forEach(p=>p.broken=true);b.shell=false;b.hp=1;b.flash=0;if(b.hurtCore)b.hurtCore();else b.hurt();return !b.alive},
 tp(x,y,z){resetPlayer(x,y,z,P.yaw)},reach(opt){return reachCheck(G.L,opt)},
 end(){startEnding()},step(n,dt){for(let i=0;i<(n||1);i++)tick(dt||1/60);render()},
 state:()=>G.state,key(k,d){if(d&&!KEYS[k])KP[k]=true;KEYS[k]=!!d},clear(){for(const k in KEYS)KEYS[k]=false},talk(){const n=nearTalk();if(n)talkTo(n);return n&&n.name},skipDlg(){while(G.state==='dlg'){const d=G.dlg;d.i=d.lines.length;G.dlg=null;G.state='play';if(d.cb)d.cb()}}};
window.MMM=MMM;
init();

</script>
