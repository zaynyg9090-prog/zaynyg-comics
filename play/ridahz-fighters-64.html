function hurtbox(F){var s=F.c.sc,bw=(F.c.feat.indexOf('bulk')>=0?28:22)*s;if(F.st==='down'||F.st==='getup'||F.st==='ko')return null;

// ---- build move data ----
function normalMove(F,k){var key=(F.y>0?'j':F.crouching?'c':'')+k,n=NORM[key];var d={};for(var q in n)d[q]=n[q];
 d.name=key;d.air=F.y>0;d.crouch=F.crouching&&!d.air;d.kind='normal';d.dmg=n.dmg;d.reach=F.c.feat.indexOf('bulk')>=0?1.15:1;d.jug=!!n.launch;return d}

 switch(sp.k){
 case 'proj':case 'arc':case 'breath':d.s=sp.k==='breath'?8:12;d.a=sp.k==='breath'?14:1;d.r=sp.k==='breath'?18:30-str*2;d.pose='cast';break;

 case 'rush':d.s=7;d.a=14+str*5;d.r=16;d.box=[4,24,26,32];d.kd=str===2?1:0;d.pose=sp.pose||'punch';d.pinv=sp.pinv;d.armor=sp.armor?1:0;break;
 case 'poke':d.s=10-str;d.a=4;d.r=18;d.box=[14,36,(sp.range+str*10)/F.c.sc,10];d.pose='punch';d.whip=1;break;

 case 'slam':d.s=6;d.a=40;d.r=16;d.box=[-10,0,40,30];d.lv='o';d.kd=1;d.pose='stomp';break;
 case 'trap':d.s=10;d.a=1;d.r=20;d.pose='cast';break;
 case 'spin':d.s=6;d.a=28;d.r=16;d.box=[-14,10,46,42];d.pose='spin';d.multi=7;d.hits=sp.hits;break;
 case 'tele':d.s=6;d.a=1;d.r=10;d.inv=18;d.pose='crouch';break;
 case 'srush':d.s=6;d.a=26;d.r=24;d.box=[4,14,30,46];d.inv=12;d.pose='punch2';d.lv='m';break;
 case 'sbeam':d.s=14;d.a=46;d.r=20;d.inv=14;d.pose='cast';break;
 case 'sgrab':d.s=3;d.a=4;d.r=30;d.grab=1;d.inv=8;d.range=sp.range;d.pose='throw';break}
 if(d.dmg)d.dmg=Math.round(d.dmg*(1+str*0.1));return d}

 if(d.sup){F.meter-=100;M.freeze=44;M.freezeBy=F;M.txt.push({s:d.name,t:0,life:70,col:F.c.glow,y:52,sc:2,banner:1});F.inv=Math.max(F.inv,d.inv||0)+44}}
// ---- per-frame input bookkeeping ----
function readInput(F){F.prevRaw=F.raw;F.raw=F.ctl?F.ctl(F):Inp.blank();var r=F.raw,d=relDir(r,F.face);
 var pressed=[];BTN.concat(['SP']).forEach(function(k){if(r[k]&&!F.prevRaw[k]){pressed.push(k);F.buf.push({k:k,age:0})}});
 F.hist.push({d:d,p:pressed});if(F.hist.length>40)F.hist.shift();
 for(var i=F.buf.length-1;i>=0;i--){if(++F.buf[i].age>5)F.buf.splice(i,1)}
 var back=d===1||d===4||d===7,down=d===1||d===2||d===3;
 if(back)F.cbHeld++;else{if(F.cbHeld>0){F.cbStore=F.cbHeld;F.cbRel=10}F.cbHeld=0}if(F.cbRel>0)F.cbRel--;

 F.dir=d}
function consume(b,F){b.used=true;F.buf=F.buf.filter(function(x){return !x.used})}
// try specials/supers: returns true if started
function trySpecial(F,cancelOnly){var c=F.c,o=opp(F),hasProj=M.proj.some(function(p){return p.owner===F&&p.kind!=='beam'});
 // simple-mode SPECIAL button
 var spb=grpPressed(F,'SP');if(spb){var d=F.dir,choice=null,str=1;
  if((d===6||d===3||d===9)&&F.meter>=100)choice=c.su;else if(d===1||d===2||d===3)choice=c.sp[1];else if(d===4||d===7)choice=c.sp[2];else choice=c.sp[0];
  if(choice===c.su){consume(spb,F);startMove(F,specialMove(F,c.su,1,true));return true}
  if(!((choice.k==='proj'||choice.k==='arc'||choice.k==='trap')&&hasProj)&&F.y<=0){consume(spb,F);startMove(F,specialMove(F,choice,str));return true}}
 if(F.y>0)return false;
 if(F.meter>=100){var sb=grpPressed(F,c.su.b);if(sb&&motion(F,c.su.i)){consume(sb,F);startMove(F,specialMove(F,c.su,strOf(sb.k),true));return true}}

  if((sp.k==='proj'||sp.k==='arc'||sp.k==='trap'||sp.k==='breath')&&hasProj)continue;
  if(motion(F,sp.i)){consume(b,F);F.cbHeld=F.cdHeld=0;F.cbRel=F.cdRel=0;startMove(F,specialMove(F,sp,strOf(b.k)));return true}}
 return false}
function pri(i){return {qcf2:9,'360':8,dp:7,cbf:5,cdu:5,qcb:4,qcf:3}[i]||1}
function tryThrow(F){var o=opp(F),both=false,lp=null,lk=null;F.buf.forEach(function(b){if(b.k==='LP'&&b.age<3)lp=b;if(b.k==='LK'&&b.age<3)lk=b});
 var hp=grpPressed(F,'HP'),fb=F.dir===4||F.dir===6;
 if(!(lp&&lk)&&!(hp&&fb&&Math.abs(o.x-F.x)<(34+10)*Math.max(F.c.sc,1)))return false;
 if(F.y>0)return false;if(lp)consume(lp,F);if(lk)consume(lk,F);if(hp&&!(lp&&lk))consume(hp,F);
 var range=(26+(F.c.feat.indexOf('bulk')>=0?10:0))*F.c.sc+11*o.c.sc+6;
 F.st='attack';F.t=0;F.mv={d:{name:'throw',kind:'throwtry',s:3,a:2,r:20,pose:'throw',grab:1,range:range,dmg:120,backT:F.dir===4},t:0,hits:0,last:-99};return true}
function tryNormal(F){for(var i=F.buf.length-1;i>=0;i--){var b=F.buf[i];if(b.used||b.k==='SP')continue;if(F.y>0&&F.airAtk)return false;
  consume(b,F);startMove(F,normalMove(F,b.k));return true}return false}
function canCancel(F){var m=F.mv;if(!m||!m.conn)return false;var d=m.d;if(d.kind==='normal'&&d.c&&m.t<d.s+d.a+d.r-2)return 'sp';if(d.kind!=='normal'&&!d.sup&&m.t<d.s+d.a+6&&F.meter>=100)return 'su';return false}
// ---- main update ----
function updateFighter(F){var o=opp(F),c=F.c,sc=c.sc;F.anim++;F.t++;if(F.inv>0)F.inv--;if(F.flash>0)F.flash--;
 var d=F.dir,neutral=NEUTRAL[F.st]||(F.st==='land'&&F.t>=(F.landT||4))||F.st==='prejump';
 // control
 if(F.control){var ssu=F.raw.SSU&&!F.prevRaw.SSU,ssd=F.raw.SSD&&!F.prevRaw.SSD;
  if(neutral&&F.y<=0&&(ssu||ssd)){F.st='step';F.t=0;F.stepDir=(ssu?-1:1)*(M.camSide||1);F.lastStep=M.T;F.crouching=false;F.vx=0;Audio.sfx('step');F.stats.steps=(F.stats.steps||0)+1;neutral=false}
  if(F.st==='step'&&F.t>=10){if(trySpecial(F)||tryThrow(F)||tryNormal(F)){}}
  if(neutral){if(F.st==='land'){F.st='stand';F.t=0}
   if(trySpecial(F)||tryThrow(F)||tryNormal(F)){}
   else if(F.st==='prejump'){if(F.t>=4){F.st='air';F.t=0;F.vy=JUMPV;F.vx=F.jdir*JUMPX*(0.85+0.15*c.spd);F.airAtk=false;Audio.sfx('jump')}}
   else if(d>=7){F.st='prejump';F.t=0;F.jdir=d===7?-F.face:d===9?F.face:0;F.crouching=false}
   else if(d<=3){if(F.st!=='crouch'){F.st='crouch';F.t=0}F.crouching=true;F.vx=0}
   else if(d===4||d===6){F.crouching=false;if(F.st!=='walk'){F.st='walk';F.t=0}F.walkDir=d===6?1:-1;F.vx=F.face*(d===6?1.55:-1.25)*c.spd}
   else{F.crouching=false;if(F.st!=='stand'){F.st='stand';F.t=0}F.vx=0}}
  else if(F.st==='air'){if(!F.airAtk)tryNormal(F)}
  else if(F.st==='attack'){var cc=canCancel(F);if(cc==='sp'){if(!trySpecial(F)&&F.mv.d.ch){var lb=null;F.buf.forEach(function(b){if(!b.used&&(b.k==='LP'||b.k==='LK'))lb=b});if(lb&&F.mv.t>=F.mv.d.s+1){consume(lb,F);F.crouching=d<=3;startMove(F,normalMove(F,lb.k))}}}
   else if(cc==='su'&&F.meter>=100){var sb=grpPressed(F,c.su.b);if((sb&&motion(F,c.su.i))||(grpPressed(F,'SP')&&(d===6||d===3))){if(sb)consume(sb,F);else consume(grpPressed(F,'SP'),F);startMove(F,specialMove(F,c.su,1,true))}}}}
 else if(neutral&&F.st!=='stand'&&F.st!=='land'&&F.y<=0){F.st='stand';F.vx=0;F.crouching=false}
 // state behaviour
 switch(F.st){
 case 'attack':moveTick(F);break;
 case 'block':case 'hit':F.vx=0;if(F.t>=F.stun){F.st=F.crouching&&F.dir<=3?'crouch':'stand';F.t=0;F.combo=0;F.juggle=0}break;
 case 'step':F.vx=0;F.z+=F.stepDir*64*(Math.sin(Math.PI*Math.min(F.t,16)/32)-Math.sin(Math.PI*Math.min(F.t-1,16)/32));if(F.t>=16){F.st='stand';F.t=0}break;
 case 'fall':break;
 case 'down':F.vx=0;if(F.hp<=0){F.st='ko';break}if(F.t>=28){F.st='getup';F.t=0;F.inv=24}break;
 case 'getup':if(F.t>=20){F.st='stand';F.t=0;F.inv=4;F.combo=0;F.juggle=0;F.crouching=false}break;
 case 'throw':F.vx=0;if(F.t>=26){F.st='stand';F.t=0}break;
 case 'thrown':var th=F.thrower;F.x=th.x+th.face*20*th.c.sc;F.z=th.z;F.y=20+Math.sin(F.t*0.3)*6;if(F.t>=18){applyDamage(F,th,F.thrownDmg,true);F.st='fall';F.t=0;F.vy=5;F.vx=th.face*(F.backT?-3:3);F.y=24;M.shake=8;Audio.sfx('throw');if(F.backT)th.face*=-1}break;
 case 'land':F.vx*=0.5;break;

 // physics

  if(F.y>0||F.vy>0){F.y+=F.vy;F.vy-=GRAV*(F.st==='fall'?0.9:1);
   if(F.y<=0){F.y=0;var was=F.st;F.vy=0;Audio.sfx('land');
    if(was==='fall'){if(F.bounce&&F.hp>0){F.bounce=0;F.vy=3.2;F.y=0.1;F.vx*=0.5}else{F.st=F.hp<=0?'ko':'down';F.t=0;F.vx=0;M.shake=Math.max(M.shake,4);dust(F)}}
    else if(was==='attack'){var md=F.mv.d;if(md.kind==='slam'&&!F.mv.landed){F.mv.landed=true;F.mv.t=md.s+md.a;F.mv.slamT=0;M.shake=10;Audio.sfx('hitH');dust(F);shockwave(F)}
     if(md.air||md.kind==='rise'||md.kind==='flip'){F.st='land';F.t=0;F.landT=md.air?3:md.r;F.mv=null;F.vx=0}}
    else if(was==='air'){F.st='land';F.t=0;F.landT=3;F.vx=0}
    else if(was==='hit'){}}}}
 // after images
 if(F.st==='attack'&&F.mv&&(F.mv.d.sp&&F.mv.d.sp.after||F.mv.d.kind==='srush')&&F.mv.t%3===0)F.after.push({x:F.x,y:F.y,z:F.z,face:F.face,yaw:F.yaw,life:12,pose:fighterPose3D(F)});
 for(var i=F.after.length-1;i>=0;i--)if(--F.after[i].life<=0)F.after.splice(i,1);
 if(F.meter>100)F.meter=100}
function dust(F){for(var i=0;i<8;i++)M.fx.push({k:'p',x:F.x+rnd(-14,14),y:2,vx:rnd(-1.2,1.2),vy:rnd(0.3,1.5),life:20,col:'#8a8094',g:0.05})}
function moveTick(F){var m=F.mv,d=m.d,o=opp(F),c=F.c;if(!m){F.st='stand';return}m.t++;var t=m.t;
 var total=d.s+d.a+d.r;
 if(t<=d.s&&d.kind!=='proj'&&d.kind!=='sbeam'&&o.st!=='step'&&M.T-o.lastStep>34&&Math.abs(o.z-F.z)<90)F.z+=(o.z-F.z)*0.2;
 if(d.kind==='rush'&&t>d.s&&o.st!=='step'&&M.T-o.lastStep>34)F.z+=(o.z-F.z)*0.06;
 switch(d.kind){

 case 'arc':if(t===d.s)spawnProj(F,{vx:F.face*(1.6+d.str*0.7),vy:4.6,g:0.16,dmg:d.dmg,look:d.sp.look,life:200,y:56*c.sc});F.vx=0;break;
 case 'breath':if(t===d.s)spawnProj(F,{vx:F.face*2.4,dmg:d.dmg,look:'fire',hits:3,life:34+d.str*8,hitEvery:6});F.vx=0;break;
 case 'trap':if(t===d.s)spawnProj(F,{vx:0,dmg:d.dmg,look:'trap',life:320,y:4,x:F.x+F.face*(46+d.str*28)*c.sc,trap:1});F.vx=0;break;
 case 'rise':case 'flip':if(t===d.s){F.vy=(d.kind==='flip'?6.6:7)+d.str*0.7;F.y=0.5;F.vx=F.face*(d.kind==='flip'?-0.6:1+d.str*0.4);sparkBurst(F.x+F.face*10,F.y+40*c.sc,c.glow,6)}
  total=999;break;
 case 'rush':if(t>=d.s&&t<d.s+d.a)F.vx=m.hit?F.face*0.5:F.face*d.sp.spd*(0.85+0.12*d.str);else F.vx*=0.7;break;
 case 'srush':if(t>=d.s&&t<d.s+d.a&&!m.locked)F.vx=F.face*6.4;else F.vx*=0.6;if(m.locked)superLock(F,m);break;
