function crystalTree(m,x,y,z,s,c){s=s||1;m.cyl(x,y,z,0.18*s,1.6*s,5,'#e8e0c8');octa(m,x,y+2.4*s,z,0.9*s,1.0*s,col(c||'#9ff0ff',.5));octa(m,x+0.6*s,y+1.8*s,z,0.4*s,0.5*s,col('#ffb0f0',.5))}
function deadTree(m,x,y,z,s){s=s||1;m.cyl(x,y,z,0.2*s,2.2*s,5,'#2a2233');m.at(M4.trs(x,y+1.6*s,z,0,0,0.7),q=>q.cyl(0,0,0,0.08*s,1*s,4,'#2a2233'));m.at(M4.trs(x,y+1.2*s,z,0,0,-0.8),q=>q.cyl(0,0,0,0.08*s,0.9*s,4,'#2a2233'))}
function lamp(m,x,y,z,c){m.cyl(x,y,z,0.1,3,5,'#3a3d44');m.cbox(x,y+3.15,z,0.45,0.35,0.45,col(c||'#fff2a8',1))}
function crystalProp(m,x,y,z,s,c){octa(m,x,y+s,z,0.35*s,s,col(c||'#b45cff',.7))}
function wreck(m,x,y,z,s,rot){m.at(M4.trs(x,y,z,rot||0,0.2,0.15),q=>{const t=q.tex;q.tex=TX.PLATE;q.box(-1.2*s,0,-3*s,1.2*s,1.4*s,3*s,'#3a3d44','#4a4d55');q.tex=t;q.box(-0.6*s,1.4*s,-1*s,0.6*s,2*s,1.5*s,'#2a2c30');q.cone(0,0.7*s,3*s,0.8*s,1.2*s,6,'#4a4d55');q.box(-2.5*s,0.5*s,-1*s,2.5*s,0.7*s,0.6*s,'#2a2c30')})}
function junk(m,x,y,z,s){const t=m.tex;m.tex=TX.RUST;for(let i=0;i<5;i++){const a=i*1.7,r=s*0.5;m.at(M4.trs(x+Math.cos(a)*r,y+i*s*0.25,z+Math.sin(a)*r,a,0.2*(i%2),0.15),q=>q.cbox(0,0,0,s*(1-i*0.12),s*0.5,s*0.8,['#8a5a3a','#6c6f78','#7a4e2c','#55585f','#9c6a3a'][i]))}m.tex=t}
function tire(m,x,y,z,r){m.at(M4.trs(x,y+r,z,0,0,Math.PI/2),q=>{q.cyl(0,-r*0.35,0,r,r*0.7,10,'#151515','#333');q.cyl(0,-r*0.36,0,r*0.45,r*0.72,8,'#555','#777')})}
function tvScreen(m,x,y,z,rot){m.at(M4.trs(x,y,z,rot||0),q=>{q.box(-0.7,0,-0.5,0.7,1.1,0.5,'#5a4a3a');q.box(-0.55,0.15,0.5,0.55,0.95,0.53,col('#bfe8ff',.7));q.box(-0.3,1.1,0,-0.27,1.6,0.03,'#888');q.box(0.27,1.1,0,0.3,1.5,0.03,'#888')})}
function bolt3(m,x,y,z,h){let px=x,pz=z,py=y;for(let i=0;i<5;i++){const nx=x+rnd(-0.6,0.6),nz=z+rnd(-0.6,0.6),ny=py+h/5;m.at(M4.trs(0,0,0),q=>q.box(Math.min(px,nx)-0.06,py,Math.min(pz,nz)-0.06,Math.max(px,nx)+0.06,ny,Math.max(pz,nz)+0.06,col('#d8b0ff',1)));px=nx;pz=nz;py=ny}}
function garage(m,x,y,z,rot){m.at(M4.trs(x,y,z,rot||0),q=>{const t=q.tex;q.tex=TX.BRICK;q.box(-6,0,-4,6,6,4,'#8a6a5a','#7a5a4a');q.tex=TX.PLATE;q.box(-6.4,6,-4.4,6.4,6.5,4.4,'#5a4a6a','#6a5a7a');q.box(-3.5,6.5,-2.5,3.5,9,2.5,'#7a5a4a','#5a4a6a');q.box(-3.8,9,-2.8,3.8,9.4,2.8,'#5a4a6a','#6a5a7a');q.tex=t;
  q.box(-3.5,0,3.98,3.5,4,4.05,'#3a3d44');for(let i=0;i<5;i++)q.box(-3.4,0.3+i*0.75,4.05,3.4,0.4+i*0.75,4.1,'#55585f');
  for(const sx of[-1,1]){q.box(sx*4.2-0.7,2,3.98,sx*4.2+0.7,3.4,4.06,col('#ffd88a',.8));q.box(sx*2-0.6,7.2,2.48,sx*2+0.6,8.3,2.56,col('#ffd88a',.8))}
  q.box(-4,4.3,4.05,4,5.6,4.2,'#2a1a3a');q.cyl(5.2,9,-2,0.35,3,6,'#555','#222')})}
function gateFrame(m,x,y,z,yaw,c,c2){m.at(M4.trs(x,y,z,yaw),q=>{q.ring(0,2.8,0,2.6,0.3,20,col(c,.35));for(let i=0;i<10;i++){const a=i/10*TAU;q.sph(Math.cos(a)*2.6,2.8+Math.sin(a)*2.6,0,0.3,5,col(c2||'#ffffff',1))}q.box(-3.2,0,-0.7,3.2,0.3,0.7,'#3a3550','#55507a')})}
function portalMesh(c,c2){return mk(m=>{m.ring(0,2.8,0,2.6,0.3,20,col(c,.35));for(let i=0;i<10;i++){const a=i/10*TAU;m.sph(Math.cos(a)*2.6,2.8+Math.sin(a)*2.6,0,0.3,5,col(c2||'#ffffff',1))}m.box(-3.2,0,-0.7,3.2,0.3,0.7,'#3a3550','#55507a')})}
function swirlMesh(c){return mk(m=>{for(let i=0;i<14;i++){const a0=i/14*TAU,a1=(i+1)/14*TAU;const cc=i%2?c:shade(c,1.5);m.tri([0,0,0],[Math.cos(a0)*2.3,Math.sin(a0)*2.3,0],[Math.cos(a1)*2.3,Math.sin(a1)*2.3,0],col(cc,1));m.tri([0,0,0],[Math.cos(a1)*2.3,Math.sin(a1)*2.3,0],[Math.cos(a0)*2.3,Math.sin(a0)*2.3,0],col(cc,1))}})}
function skyMesh(top,mid,bot,stars,extra){return mk(m=>{const seg=20,rings=[[1,top],[0.55,mid],[0.12,bot],[-0.3,bot]];for(let r=0;r<rings.length-1;r++){const[y0,c0]=rings[r],[y1,c1]=rings[r+1];const r0=Math.sqrt(1-Math.min(.99,y0*y0)),r1=Math.sqrt(1-Math.min(.99,y1*y1));
  for(let i=0;i<seg;i++){const a0=i/seg*TAU,a1=(i+1)/seg*TAU;const A=[Math.cos(a0)*r0,y0,Math.sin(a0)*r0],B=[Math.cos(a1)*r0,y0,Math.sin(a1)*r0],C=[Math.cos(a1)*r1,y1,Math.sin(a1)*r1],D=[Math.cos(a0)*r1,y1,Math.sin(a0)*r1];
   const n=[0,1,0],ca=col(c0,1),cb=col(c1,1);m.v(A,n,ca);m.v(D,n,cb);m.v(C,n,cb);m.v(A,n,ca);m.v(C,n,cb);m.v(B,n,ca)}}
  if(stars){for(let i=0;i<160;i++){const a=Math.random()*TAU,y=0.1+Math.random()*0.9,r=Math.sqrt(1-y*y)*0.98;const p=[Math.cos(a)*r,y*0.98,Math.sin(a)*r],s=0.003+Math.random()*0.005;m.tri([p[0]-s,p[1],p[2]],[p[0]+s,p[1],p[2]],[p[0],p[1]+s*2,p[2]],col(stars,1));m.tri([p[0]+s,p[1],p[2]],[p[0]-s,p[1],p[2]],[p[0],p[1]+s*2,p[2]],col(stars,1))}}
  if(extra)extra(m)})}
function cloudMesh(c){return mk(m=>{m.sph(0,0,0,2,7,col(c||'#ffffff',.55),0,0.5);m.sph(1.8,-0.2,0.3,1.4,6,col(c||'#ffffff',.55),0,0.55);m.sph(-1.7,-0.3,-0.2,1.3,6,col(c||'#ffffff',.55),0,0.55)})}
/* ---------- level builder + collision ---------- */
const GRAV=34,JUMPV=13.2,PR=0.45,PH=1.7;
function newLevel(){const L={solids:[],items:[],enemies:[],npcs:[],portals:[],pads:[],blocks:[],checks:[],signs:[],movers:[],mb:new MB(),fx:new MB(),spawn:[0,0,0,Math.PI],killY:-12,boss:null,starAt:{},shardStar:null};
 // top-surface builders. c=side color, tc=top color
 L.box=(x0,y0,z0,x1,y1,z1,c,tc,o)=>{const s=Object.assign({t:'box',x0,y0,z0,x1,y1,z1},o||{});L.solids.push(s);if(!s.nomesh)L.mb.box(x0,y0,z0,x1,y1,z1,c,tc);return s};
 L.plat=(x,z,w,d,top,h,c,tc,o)=>L.box(x-w/2,top-(h||1),z-d/2,x+w/2,top,z+d/2,c,tc,o);
 L.col=(x,z,r,top,h,c,tc,o)=>{const s=Object.assign({t:'cyl',x,z,r,y0:top-(h||1),y1:top},o||{});L.solids.push(s);L.mb.cyl(x,top-(h||1),z,r,h||1,Math.max(8,Math.min(20,Math.round(r*3))),c,tc);return s};
 L.ramp=(x,z,w,d,ya,yb,axis,c,tc)=>{const x0=x-w/2,x1=x+w/2,z0=z-d/2,z1=z+d/2,yb0=Math.min(ya,yb)-1;
  const s={t:'ramp',x0,z0,x1,z1,ya,yb,axis,y0:yb0,y1:Math.max(ya,yb)};L.solids.push(s);
  const ty=(px,pz)=>axis==='z'?lerp(ya,yb,(pz-z0)/(z1-z0)):lerp(ya,yb,(px-x0)/(x1-x0));
  const p0=[x0,ty(x0,z0),z0],p1=[x1,ty(x1,z0),z0],p2=[x1,ty(x1,z1),z1],p3=[x0,ty(x0,z1),z1],b0=[x0,yb0,z0],b1=[x1,yb0,z0],b2=[x1,yb0,z1],b3=[x0,yb0,z1];
  const m=L.mb;m.quad(p3,p2,p1,p0,tc||c);m.quad(b3,b2,p2,p3,c);m.quad(b1,b0,p0,p1,c);m.quad(b2,b1,p1,p2,shade(c,.92));m.quad(b0,b3,p3,p0,shade(c,.92));
  // stripes on ramp top for chunky N64 look
  for(let i=1;i<6;i++){const f=i/6;if(axis==='z'){const zz=lerp(z0,z1,f),y=ty(x,zz)+0.02;m.quad([x0+0.2,y,zz+0.12],[x1-0.2,y,zz+0.12],[x1-0.2,y,zz-0.12],[x0+0.2,y,zz-0.12],shade(tc||c,.85))}else{const xx=lerp(x0,x1,f),y=ty(xx,z)+0.02;m.quad([xx-0.12,y,z1-0.2],[xx+0.12,y,z1-0.2],[xx+0.12,y,z0+0.2],[xx-0.12,y,z0+0.2],shade(tc||c,.85))}}
  return s};
 L.coin=(x,y,z)=>L.items.push({k:'coin',x,y,z});
 L.coinRing=(x,y,z,r,n)=>{for(let i=0;i<n;i++){const a=i/n*TAU;L.coin(x+Math.cos(a)*r,y,z+Math.sin(a)*r)}};
 L.coinLine=(x0,y0,z0,x1,y1,z1,n)=>{for(let i=0;i<n;i++){const f=n>1?i/(n-1):0;L.coin(lerp(x0,x1,f),lerp(y0,y1,f),lerp(z0,z1,f))}};
 L.heart=(x,y,z)=>L.items.push({k:'heart',x,y,z});
 L.shard=(x,y,z)=>L.items.push({k:'shard',x,y,z});
 L.star=(id,name,x,y,z,hidden)=>{const it={k:'star',id,name,x,y,z,hidden:!!hidden};L.items.push(it);L.starAt[id]=it;return it};
 L.enemy=(type,x,y,z,o)=>L.enemies.push(Object.assign({type,x,y,z,hx:x,hy:y,hz:z},o||{}));
 L.npc=(name,model,x,y,z,yaw,lines)=>L.npcs.push({name,H:model.mesh?null:humanoid(model),mesh:model.mesh,x,y,z,yaw,yaw0:yaw,lines,li:0});
 L.sign=(x,y,z,yaw,title,lines)=>{L.mb.at(M4.trs(x,y,z,yaw),m=>{m.box(-0.1,0,-0.1,0.1,1.2,0.1,'#6b4423');m.box(-0.9,1.1,-0.08,0.9,2.0,0.08,'#c8955a','#a87a45')});L.signs.push({name:title,x,y,z,lines,li:0,sign:1})};
 L.portal=(x,y,z,yaw,target,req,label,c,c2)=>{const p={x,y,z,yaw,target,req,label,c,mesh:portalMesh(c,c2),sw:swirlMesh(c)};L.portals.push(p);return p};
 L.pad=(x,y,z,yaw)=>{L.pads.push({x,y,z,yaw});L.mb.at(M4.trs(x,y,z,yaw),m=>{m.box(-1.3,0,-1.5,1.3,0.12,1.5,'#2a2d35');for(let i=0;i<3;i++)m.quad([-0.9,0.14,-0.9+i*0.8],[0.9,0.14,-0.9+i*0.8],[0,0.14,-0.3+i*0.8],[0,0.14,-0.3+i*0.8],col('#ffd23f',1))})};
 L.glitch=(x,y,z,s)=>{s=s||2;const sol=L.box(x-s/2,y,z-s/2,x+s/2,y+s,z+s/2,null,null,{nomesh:1,glitch:1});const b={x,y,z,s,sol,alive:true,ph:Math.random()*6};L.blocks.push(b);return b};
 L.phaseWall=(x0,y0,z0,x1,y1,z1)=>{const s=L.box(x0,y0,z0,x1,y1,z1,null,null,{nomesh:1,phase:1});L.phases=L.phases||[];L.phases.push(s);return s};
 L.check=(x,y,z)=>{L.checks.push({x,y,z,on:false});L.mb.at(M4.trs(x,y,z,0),m=>{m.cyl(0,0,0,0.12,2.6,5,'#ddd');})};
 L.mover=(x0,y,z0,x1,z1,w,d,period,c,tc,o)=>{o=o||{};const s={t:'box',x0:0,y0:y-0.8,z0:0,x1:0,y1:y,z1:0,mv:{ax:x0,az:z0,bx:x1,bz:z1,ay:y,by:o.y1===undefined?y:o.y1,w,d,T:period,ph:o.ph||0},dx:0,dz:0,dy:0};L.solids.push(s);L.movers.push(s);const tx=L.mb.tex;s.mesh=mk(m=>{m.tex=o.tex===undefined?tx:o.tex;m.box(-w/2,-(o.h||0.8),-d/2,w/2,0,d/2,c,tc)});s.y0=y-(o.h||0.8);s.hh=o.h||0.8;placeMover(s,s.mv.ph);s.dx=s.dz=s.dy=0;return s};
 L.zap=(x0,y0,z0,x1,y1,z1)=>{const s=L.box(x0,y0,z0,x1,y1,z1,null,null,{nomesh:1,zap:1});L.zaps=L.zaps||[];L.zaps.push(s);return s};
 L.hook=(x,y,z)=>{L.hooks=L.hooks||[];L.hooks.push({x,y,z})};
 L.stake=(x,y,z,grp)=>{L.stakes=L.stakes||[];const st={x,y,z,grp,h:0.9,down:false};st.sol={t:'cyl',x,z,r:0.5,y0:y,y1:y+0.9};L.solids.push(st.sol);L.stakes.push(st);return st};
 L.orb=(x,y,z)=>L.items.push({k:'orb',x,y,z});
 L.crate=(x,y,z,n)=>{const s=L.box(x-0.7,y,z-0.7,x+0.7,y+1.4,z+0.7,null,null,{nomesh:1,crate:1});L.crates=L.crates||[];L.crates.push({x,y,z,s,n:n||3,alive:true});return s};
 L.spring=(x,y,z,v)=>{L.springs=L.springs||[];L.springs.push({x,y,z,v:v||24,t:0})};
 L.warp=(x,y,z,tx,ty,tz)=>{L.warps=L.warps||[];L.warps.push({x,y,z,tx,ty,tz})};
 L.pedestal=(x,y,z)=>{L.mb.cyl(x,y-0.6,z,1.1,0.6,10,'#8a7a9a','#d8c8ff')};
 return L}
function placeMover(s,t){const m=s.mv;const f=(1-Math.cos(t/m.T*TAU))/2;const cx=lerp(m.ax,m.bx,f),cz=lerp(m.az,m.bz,f),cy=lerp(m.ay,m.by,f);s.y1=cy;s.y0=cy-(s.hh||0.8);s.dx=cx-((s.x0+s.x1)/2||cx);s.dz=cz-((s.z0+s.z1)/2||cz);if(!s._init){s.dx=0;s.dz=0;s._init=1}s.x0=cx-m.w/2;s.x1=cx+m.w/2;s.z0=cz-m.d/2;s.z1=cz+m.d/2;s.cx=cx;s.cz=cz}
/* --- collision queries --- */
function solidActive(s,who){if(s.dead)return false;if(s.phase&&who&&who.phasing)return false;if(s.zap&&who&&who.blinking)return false;return true}

 const stomp=touch&&P.vy<-1&&P.y>y+h*0.55;const spin=(P.atkT>0)&&d<r+1.8&&P.y<y+h+0.6&&P.y+PH>y-0.6;const pound=P.act==='pound'&&d<r+0.9&&P.y>y+h*0.4&&P.y<y+h+1.5;
 if(vuln&&(stomp||spin||pound||(touch&&playerAttacking()))){if(stomp||pound||P.y>y+h*0.5){P.vy=13;P.cut=true;P.act='air';P.kind='up'}else{const l=d||1;P.vx=(P.x-x)/l*10;P.vz=(P.z-z)/l*10;P.vy=6;P.act='air';P.kind='fall'}return true}
 if(touch&&!stomp){if(!vuln&&!P.phasing)hurtPlayer(1,x,z);const l=d||1;if(d<r+PR){P.x=x+(P.x-x)/l*(r+PR);P.z=z+(P.z-z)/l*(r+PR)}}
 else if(stomp&&!vuln){P.vy=10;P.cut=true;P.act='air';P.kind='up'}
 return false}

 G.waves=[];G.proj=G.proj.filter(p=>p.own==='p');G.L.enemies.forEach(e=>{if(e.minion&&e.alive){e.alive=false;burst(e.x,e.y+0.6,e.z,'#fff',8,4)}});
 if(b.final){G.endPending=2.5;banner('THE HOLLOW KING KNEELS','','#ffffff',3);return}
 banner(b.name+' DEFEATED!','A DAWNSTAR appeared!','#ffd23a',3);const st=G.L.starAt[b.star];if(st){st.hidden=false;st.x=b.x0c;st.z=b.z0c;st.y=b.y0+1.8;st.popT=1;burst(st.x,st.y,st.z,'#ffd23a',20,6)}
 SND.play(WORLDS[G.w].music);if(b.after)setTimeout(()=>{if(G.state==='play')story(typeof b.after==='function'?b.after():b.after)},900)}
function bossHurt(b,n){b.hp-=n||1;b.inv=1;SND.sfx('bosshit');G.shake=0.3;burst(b.x,b.y+2,b.z,'#ffffff',14,7);if(b.hp<=0)bossDefeated(b)}
function makeBoss(def){const b=Object.assign({alive:true,inv:0,t:0,st:'idle',x:def.x,y:def.y,z:def.z,y0:def.y,yaw:0},def);const T=BOSSES[def.type];Object.assign(b,T.base());b.T=T;b.maxhp=b.hp;b.final=!!T.final;
 b.update=dt=>{b.t+=dt;b.inv-=dt;T.update(b,dt)};b.draw=()=>T.draw(b);b.reset=()=>{const keep={alive:b.alive};Object.assign(b,T.base(),{x:def.x,y:def.y,z:def.z,inv:0,t:0},keep);b.maxhp=b.hp;if(T.init)T.init(b)};
 b.projHit=p=>T.projHit?T.projHit(b,p):false;b.whip=(x,y,z)=>T.whip?T.whip(b,x,y,z):false;if(T.init)T.init(b);return b}
function faceP(b,dt,k){b.yaw+=angDiff(b.yaw,Math.atan2(P.x-b.x,P.z-b.z))*Math.min(1,dt*(k||4))}
function shootAt(b,x,y,z,spd,mesh,o){const dx=P.x-x,dy=P.y+0.9-y,dz=P.z-z,l=Math.hypot(dx,dy,dz)||1;G.proj.push(Object.assign({own:'e',x,y,z,vx:dx/l*spd,vy:dy/l*spd,vz:dz/l*spd,t:4,r:0.5,mesh},o||{}));SND.sfx('shoot')}
function lob(x,y,z,tx,tz,time,mesh,o){const g=18;G.proj.push(Object.assign({own:'e',x,y,z,vx:(tx-x)/time,vz:(tz-z)/time,vy:(0.5*g*time*time-(y-(o&&o.ty||0)))/time,g,t:time+1,r:0.55,mesh,ground:1},o||{}))}
function setSt(b,s){b.st=s;b.st_t=0}
function bossLine(b,who,lines){const i=clamp(b.maxhp-b.hp-1,0,lines.length-1);story([[who,lines[i]]])}
const BOSSES={

   else if(b.st==='whip'){faceP(b,dt,3);if(b.st_t>0.5&&!b.fired){b.fired=1;SND.sfx('whip');G.waves.push({x:b.x,y:b.y0,z:b.z,r:1,spd:p2?11:9,max:12,c:'#ff3b5c'});if(p2)setTimeout(()=>{if(b.alive&&G.bossOn)G.waves.push({x:b.x,y:b.y0,z:b.z,r:1,spd:8,max:12,c:'#ff8fa0'})},450)}if(b.st_t>1.1){b.fired=0;setSt(b,'stalk')}}
   else if(b.st==='dash'){if(b.st_t<0.45){faceP(b,dt,8);b.dx=Math.sin(b.yaw);b.dz=Math.cos(b.yaw)}else{b.x+=b.dx*22*dt;b.z+=b.dz*22*dt;if(Math.random()<0.6)burst(b.x,b.y0+1,b.z,'#ff3b5c',1,1,0.4);
     if(Math.hypot(b.x-b.x0c,b.z-b.z0c)>R){b.x-=b.dx*0.6;b.z-=b.dz*0.6;SND.sfx('crash');G.shake=0.2;setSt(b,'dizzy')}else if(b.st_t>1.4)setSt(b,'dizzy')}}

   else if(b.st==='split'){if(b.st_t<dt*1.5){b.figs=[];const n=p2?5:4,real=(Math.random()*n)|0;for(let i=0;i<n;i++){const a=i/n*TAU+Math.random();b.figs.push({x:b.x0c+Math.cos(a)*7,z:b.z0c+Math.sin(a)*7,real:i===real,pop:false,t:0})}SND.sfx('phase');banner('BLOOD MIRAGE!','Strike the SHIMMERING one!','#ff8fa0',1.6)}
    for(const f of b.figs){if(f.pop)continue;f.t+=dt;const a=Math.atan2(P.x-f.x,P.z-f.z);if(b.st_t>1.2){f.x+=Math.sin(a)*(p2?3.4:2.6)*dt;f.z+=Math.cos(a)*(p2?3.4:2.6)*dt}
     const d=Math.hypot(P.x-f.x,P.z-f.z);const hit=(P.atkT>0||P.act==='dive'||P.act==='pound'||P.phasing)&&d<2.2||(P.vy<-1&&d<1.3&&P.y>b.y0+0.8);
     if(hit){if(f.real){b.x=f.x;b.z=f.z;b.figs=[];if(b.inv<=0){bossHurt(b);P.vy=11;P.act='air';P.kind='up';if(b.alive){setSt(b,'stalk');bossLine(b,'VEXA-3',['You hesitate... and still you hit like a storm.','The Wraiths sent me to bring you back, Ridah-9. Why won\'t you fight angry?'])}}break}else{f.pop=true;SND.sfx('poof');burst(f.x,b.y0+1,f.z,'#ff8fa0',12,4)}}
     else if(d<1.0&&P.y<b.y0+1.8&&!f.real)hurtPlayer(1,f.x,f.z)}
    if(b.st==='split'&&(b.st_t>9||b.figs.every(f=>f.pop||f.real)&&b.figs.filter(f=>!f.pop).length===1&&b.st_t>6)){const r=b.figs.find(f=>f.real);if(r){b.x=r.x;b.z=r.z}b.figs=[];setSt(b,'whip')}}
   else if(b.st==='recoil'){if(b.st_t>0.9)setSt(b,'stalk')}

  whip(b,x,y,z){if(b.st==='dizzy'&&b.inv<=0&&Math.hypot(x-b.x,z-b.z)<1.2){bossHurt(b);if(b.alive)setSt(b,'recoil');return true}return false},
  draw(b){const h=HEROES[3].H;const fl=b.inv>0&&(b.t*20|0)%2;const S=1.3;const save=h.s;h.s=S;
   if(b.st==='split'){for(const f of b.figs){if(f.pop)continue;const sh=f.real?(Math.sin(b.t*25)>0?[1.5,1.2,1.4,1]:[1,1,1,1]):[0.75,0.45,0.55,1];drawHumanoid(h,f.x+(f.real?Math.sin(b.t*30)*0.04:0),b.y0,f.z,Math.atan2(P.x-f.x,P.z-f.z),{walk:0.6,ph:b.t*8},sh,f.real?0.15:0.3);drawShadow(f.x,b.y0,f.z,0.7)}}
   else{const an={walk:b.st==='stalk'?0.7:0,ph:b.t*9};if(b.st==='whip'){an.armUpR=-2.4+Math.min(1,b.st_t*2)*2.6}if(b.st==='dash'&&b.st_t>0.45)an.lean=0.6;if(b.st==='dizzy'){an.spin=Math.sin(b.t*4)*0.4;an.nod=0.4}

    if(b.st==='whip'&&b.st_t>0.4&&b.st_t<0.8)drawA(MESH.ringFX,M4.trs(b.x,b.y0+0.4,b.z,b.t*20,0,0,3,0.3,3),[1,0.3,0.4,0.7],1);
    if(b.st==='dizzy')for(let i=0;i<3;i++){const a=b.t*4+i*2.1;draw(MESH.spark,M4.trs(b.x+Math.cos(a)*0.6,b.y0+2.9,b.z+Math.sin(a)*0.6,b.t*3,0,0,0.6),[1,1,0.5,1],1)}
    drawShadow(b.x,b.y0,b.z,0.9)}h.s=save}},
 /* GENERAL RUIN · IRON REQUIEM: stomps, scrap barrages, charges; crashes into a wall and his back furnace vent opens */
 ruin:{base:()=>({hp:3,name:'GENERAL RUIN',c:'#ff7a1a',st:'march',st_t:0,dx:0,dz:0,n:0}),

 /* THE HOLLOW KING (finale): phase 1 orb volleys & slams, hit his core while dazed; phase 2 reflect his starlight orbs back at him; phase 3 light the three pylons */
 hollow:{final:1,base:()=>({hp:7,name:'THE HOLLOW KING',c:'#ff3b2f',st:'move',st_t:0,tx:0,tz:0,shots:0,ph:1,pyl:[]}),

let last=0;G.dt=0.016;
function openFile(i){G.file=i;const f=readFile(i);G.stars=new Set(f?f.stars:[]);G.motes=f?f.motes||0:0;G.ended=f?!!f.ended:false;G.unlocked.vexa=f?!!f.vexa:false;G.playTime=f?f.t||0:0;G.seen=f&&f.seen?f.seen:{};P.hero=f&&f.hero&&heroAvail(f.hero)?f.hero:0;P.hp=P.maxhp;save();
 SND.resume();fadeOut(()=>{loadWorld(0,0);if(!f){G.state='intro';G.page=0;G.typ=0;SND.play('file')}else{G.state='play';banner(WORLDS[0].name,WORLDS[0].sub,'#ffd23a',2.4)}},0.6);G.state='starting'}
function tick(dt){G.t+=dt;G.dt=dt;pollInput();
 if(DEBUG&&IN.tapP&&IN.tap&&G.state==='play'&&dbgClick(IN.tap)){clearInput();return}
 if(DEBUG&&G.state==='play'){if(KP['g'])RD64.stars(G.stars.size+1);if(KP['b'])RD64.boss();if(KP['n'])RD64.go((G.w+1)%WORLDS.length);if(KP['h'])P.hp=P.maxhp}
 updFade(dt);
 if(G.state==='title'){if((IN.anyP||IN.tapP)&&!G.fadeCB){SND.resume();SND.sfx('ok');G.state='files';G.menu=0;G.erase=false;SND.play('file');FILEDATA=[0,1,2].map(readFile)}}
 else if(G.state==='files'){const a=menuInput();if(IN.backP){G.state='title';SND.play('title')}
  if(a==='mus')SND.toggle();else if(a==='erase')G.erase=!G.erase;else if(a&&a[0]==='f'){const i=+a[1];if(G.erase){if(FILEDATA[i]){if(G.eraseConfirm===i){localStorage.removeItem(fileKey(i));FILEDATA[i]=null;G.erase=false;G.eraseConfirm=-1;toast('FILE '+'ABC'[i]+' ERASED','#ff8080')}else{G.eraseConfirm=i;toast('Press again to erase FILE '+'ABC'[i],'#ff8080')}}}else openFile(i)}}
 else if(G.state==='intro'){G.typ+=dt*45;if(IN.okP||IN.tapP||IN.jumpP||IN.atkP){const s=INTRO[G.page][1];if(G.typ<s.length)G.typ=999;else{G.page++;G.typ=0;SND.sfx('menu');if(G.page>=INTRO.length){G.seen.intro=1;save();G.state='play';SND.play('hub');banner(WORLDS[0].name,WORLDS[0].sub,'#ffd23a',2.6)}}}}
 else if(G.state==='course'){const a=menuInput();if(a==='go'){startCourse()}else if(a==='hub'){G.state='play';goWorld(0)}}
 else if(G.state==='play'){G.playTime+=dt;if(G.endPending){G.endPending-=dt;if(G.endPending<=0){G.endPending=0;startEnding()}}
  if(IN.pauseP&&!G.fadeCB){G.state='pause';G.menu=0;SND.sfx('menu');SND.engine(false)}
  else if(G.mode==='drive'){updateDrive(dt);updParts(dt);G.flash=Math.max(0,G.flash-dt*2);G.shake=Math.max(0,G.shake-dt);if(WORLDS[G.w].lightning&&Math.random()<dt*0.1)G.flash=0.5}
  else{updatePlayer(dt);updateEnemies(dt);updateWorld(dt);updateProj(dt);updateWaves(dt);updParts(dt);updateCam(dt)}}
 else if(G.state==='pause'){const a=menuInput();if(IN.pauseP||a==='res'||IN.backP)G.state='play';else if(a==='hub'){G.state='play';goWorld(0)}else if(a==='retry'){G.state='play';loadWorld(G.w,0);G.state='play'}else if(a==='mus')SND.toggle();else if(a==='zoom')G.cam.zl=(G.cam.zl+1)%3;else if(a==='quit'){save();fadeOut(()=>{G.state='title';loadWorld(1,0);SND.play('title')},0.5)}}
 else if(G.state==='dlg'){updParts(dt);const d=G.dlg;const ln=d.lines[d.i];const tx=Array.isArray(ln)?ln[1]:ln;d.typ=(d.typ||0)+dt*55;if(IN.okP||IN.tapP||IN.atkP||IN.jumpP){if(d.typ<tx.length)d.typ=999;else{d.i++;d.typ=0;SND.sfx('menu');if(d.i>=d.lines.length){G.dlg=null;G.state='play';if(d.cb)d.cb()}}}}
 else if(G.state==='starget'){G.stargetT-=dt;updParts(dt);P.yaw+=dt*5;updateCam(dt);if(G.stargetT<=0){if(G.stargetBoss){G.state='play';if(G.w!==0)goWorld(0);else SND.play(WORLDS[0].music)}else{G.state='staymenu';G.menu=0}}}
 else if(G.state==='staymenu'){const a=menuInput();if(a==='stay'){G.state='play';SND.play(WORLDS[G.w].music)}else if(a==='hub'){G.state='play';goWorld(0)}}
 else if(G.state==='driveend'){updParts(dt);const a=menuInput();if(a==='retry'){loadWorld(G.w,0);G.state='play'}else if(a==='hub'){G.state='play';goWorld(0)}}
