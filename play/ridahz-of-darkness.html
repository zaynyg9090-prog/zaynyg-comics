const STAGES=[
 {name:'UMBRAXIS RUN',type:'race',kind:1,obj:'Reach the finish before the timer hits zero. Dodge the Wraith hunter cars, grab energy orbs, PHASE to pass through danger.'},

function isPlayState(){return G.state==='race'||G.state==='brawl'}
function banner(s,d){if(G)G.banner={s:normTxt(s),t:d||2}}
function addScore(n){G.score+=n;if(G.score>G.best){G.best=G.score;store.set('best',G.best)}}
function shake(n){G.shake=Math.max(G.shake,n)}
function flash(c,t){G.flashC=c;G.flash=t||0.15}
function spark(x,y,n,cols,sp,scr,grav){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=rnd(sp*0.3,sp);G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(grav?sp*0.3:0),life:rnd(.25,.7),max:.7,c:pick(cols),s:Math.random()<.3?2:1,g:grav||0,scr:!!scr})}}
function pop(x,y,s,c,scr){G.pops.push({x,y,s:normTxt(s),t:1,c:c||C.wh,scr:!!scr})}
function updFx(dt){G.shake=Math.max(0,G.shake-dt*30);G.flash=Math.max(0,G.flash-dt);if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null}
 for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=0.97;p.life-=dt}G.parts=G.parts.filter(p=>p.life>0);if(G.parts.length>500)G.parts.splice(0,G.parts.length-500);
 for(const p of G.pops){p.y-=18*dt;p.t-=dt}G.pops=G.pops.filter(p=>p.t>0)}
function drawFx(camX,scr){for(const p of G.parts){if(p.scr!==scr)continue;R(p.x-(scr?0:camX),p.y,p.s,p.s,p.c)}
 for(const p of G.pops){if(p.scr!==scr)continue;if(p.t<0.3&&((p.t*20)|0)%2)continue;txt(p.s,p.x-(scr?0:camX),p.y,p.c,1,'c',true)}}
function setTouchLabels(){const st=STAGES[G.stage];const race=st&&st.type==='race'&&(G.state==='race'||G.state==='card');
 document.getElementById('lA').textContent=race?'GAS':'HIT';document.getElementById('lB').textContent=race?'BRAKE':'JUMP'}
function updateTouchUI(){const play=isPlayState()||G.state==='card'||G.state==='dead'||G.state==='clear';tcEl.classList.toggle('on',isTouch&&play);
 document.getElementById('foot').style.display=(G.state==='title')?'block':'none';setTouchLabels()}
function setState(s){G.state=s;updateTouchUI()}
// ---- flow
function newGame(stage,score){G.lives=3;G.score=score||0;startStage(stage||0)}
function startStage(i){G.stage=i;G.stageScore=G.score;G.health=100;G.energy=i===0?40:60;G.adren=0;G.parts=[];G.pops=[];G.banner=null;G.cardT=3.4;
 G.save={stage:i,score:G.score};store.set('save',G.save);setState('card');stopSong();sfx('select')}
function beginStage(){const st=STAGES[G.stage];if(st.type==='race'){initRace(st.kind);setState('race');playSong(st.kind===1?'race':'race2')}
 else{initBrawl(st.boss);setState('brawl');playSong(st.boss?'boss':'stage')}}
function stageClear(msg){if(G.state==='clear')return;G.clearMsg=normTxt(msg||'');G.clearT=4;setState('clear');stopSong();sfx('win');flash(C.wh,.3)}
function loseLife(msg){if(G.state==='dead'||G.state==='clear')return;G.lives--;G.deadMsg=normTxt(msg||'DRAYKE IS DOWN');G.deadT=2.6;setState('dead');stopSong();sfx('lose');shake(6)}
function afterDead(){if(G.lives>0){G.score=G.stageScore;startStage(G.stage)}else{setState('gameover');G.gsel=0;playSong('title')}}
function afterClear(){if(G.stage<3)startStage(G.stage+1);else startEnding()}
function startEnding(){setState('ending');G.page=0;G.typ=0;playSong('end');G.save=null;store.set('save',null)}
function pauseGame(){if(!isPlayState())return;G.prevState=G.state;G.psel=0;setState('paused');stopSong();updateTouchUI()}
function resumeGame(){if(G.state!=='paused')return;setState(G.prevState);const st=STAGES[G.stage];playSong(st.type==='race'?(st.kind===1?'race':'race2'):(st.boss?'boss':'stage'))}
function toTitle(){setState('title');G.tp=1;G.menu=0;G.save=store.get('save',null);playSong('title')}

function menuItems(){const m=[{id:'start',s:'START GAME'}];if(G.save&&G.save.stage>0)m.push({id:'cont',s:'CONTINUE - STAGE '+(G.save.stage+1)});m.push({id:'how',s:'HOW TO PLAY'});return m}

function canvasTap(x,y){
 if(G.state==='title'){if(G.tp===0){G.tp=1;sfx('select');playSong('title');return}const m=menuItems();for(let i=0;i<m.length;i++){if(Math.abs(y-(118+i*15))<7&&Math.abs(x-160)<110){G.menu=i;menuSelect(m[i].id);return}}}

function updateMenus(dt){
 if(G.state==='title'){if(G.tp===0){if(I.any()){G.tp=1;sfx('select');playSong('title')}return}
  const m=menuItems();if(I.p('up')){G.menu=(G.menu+m.length-1)%m.length;sfx('step')}if(I.p('down')){G.menu=(G.menu+1)%m.length;sfx('step')}G.menu=Math.min(G.menu,m.length-1);

 else if(G.state==='dead'){G.deadT-=dt;if(G.deadT<=0)afterDead()}

function buildTrack(kind){const segs=[];const lastY=()=>segs.length?segs[segs.length-1].p2.world.y:0;

 else{road(30,30,30,0,0);road(40,60,40,3,15);road(25,25,25,-5,-15);road(40,40,40,0,25);road(25,40,25,5,-10);road(25,25,25,-4,0);road(25,25,25,4,10);road(50,50,50,0,-25);
  road(40,40,40,-3,0);road(30,30,30,2,15);road(40,40,40,-5,-15);road(60,60,60,0,0)}
 const y=lastY();road(40,40,40,0,-y/RS.segLen);
 return segs}

function atkBox(){const P=B.P,f=P.face,big=P.combo===3;const a=P.x+f*4,b=P.x+f*(big?32:27);return{l:Math.min(a,b),r:Math.max(a,b),t:P.y-(big?36:28),b:P.y-2}}
function doAttackHits(){const P=B.P,box=atkBox(),dmg=(P.combo===3?2:1)*(P.surge>0?2:1);
 for(const e of B.en){if(e.hitId===P.atkId)continue;const eb=e.type==='dem'?{l:e.x-8,r:e.x+8,t:e.y-22,b:e.y-2}:{l:e.x-8,r:e.x+8,t:e.y-24,b:e.y};
  if(ov(box,eb)){e.hitId=P.atkId;e.hp-=dmg;e.flash=0.12;e.stun=P.combo===3?0.5:0.3;e.vx=P.face*(P.combo===3?170:60)*(P.surge>0?1.4:1);if(e.type==='dem'&&P.combo===3)e.vy=-80;e.st='walk';e.t=0.6;
   gainHit(e.x,e.y-14)}}
 if(B.V)hitVexa(box,dmg)}
function gainHit(x,y){const P=B.P;G.hitstop=0.045;sfx('hit');spark(x,y,8,P.surge>0?[C.em1,C.em2,C.wh]:[C.pu3,C.wh,C.pu2],90);addScore(10);if(P.surge<=0)G.adren=Math.min(100,G.adren+7);if(P.combo===3)shake(3)}
function updateEnemy(e,dt){const P=B.P;e.flash-=dt;e.anim+=dt*6;const dx=P.x-e.x,adx=Math.abs(dx);
 if(e.stun>0){e.stun-=dt;e.x+=e.vx*dt;e.vx*=0.9;if(e.type==='dem'){e.y+=e.vy*dt;e.vy*=0.9}return}
 if(!e.entered&&e.type!=='dem'){e.face=e.x<B.camX+W/2?1:-1;e.x+=e.face*50*dt;e.anim+=dt*2;if(e.x>B.camX+14&&e.x<B.camX+W-14)e.entered=true;return}
 if(e.st!=='slash'&&e.st!=='dive')e.face=dx<0?-1:1;e.t-=dt;
 if(e.type==='sol'){
  if(e.st==='walk'){if(adx>20)e.x+=e.face*ETYPE.sol.sp*dt;if(adx<24&&Math.abs(P.y-e.y)<20&&e.t<=0){e.st='wind';e.t=0.45}}
  else if(e.st==='wind'){if(e.t<=0){e.st='slash';e.t=0.2;e.dmgDone=false;sfx('swing')}}
  else if(e.st==='slash'){const f=e.face,a=e.x+f*4,b=e.x+f*26;if(!e.dmgDone&&ov({l:Math.min(a,b),r:Math.max(a,b),t:e.y-22,b:e.y-6},pBox())){e.dmgDone=hurtPlayer(8,e.x)}if(e.t<=0){e.st='rest';e.t=0.8}}
  else if(e.st==='rest'){if(e.t<=0){e.st='walk';e.t=0.3}}}
 else if(e.type==='rob'){
  if(e.st==='walk'){if(adx<70)e.x-=e.face*ETYPE.rob.sp*dt;else if(adx>130)e.x+=e.face*ETYPE.rob.sp*dt;e.cd-=dt;if(e.cd<=0&&adx<230){e.st='aim';e.t=0.45}}
  else if(e.st==='aim'){if(e.t<=0){B.shots.push({x:e.x+e.face*14,y:e.y-14,vx:e.face*115,life:3});sfx('shoot');e.st='walk';e.cd=rnd(1.8,2.8)}}
  }
 else if(e.type==='dem'){
  if(e.st==='walk'){const tx=P.x+(e.x<P.x?-50:50);e.x+=clamp(tx-e.x,-1,1)*ETYPE.dem.sp*dt;e.y=lerp(e.y,e.base+Math.sin(e.anim*.5)*8,dt*3);e.cd-=dt;if(e.cd<=0&&adx<120){e.st='dive';e.t=0.7;const a=Math.atan2(P.y-12-(e.y-12),dx);e.vx=Math.cos(a)*180;e.vy=Math.sin(a)*180;e.face=e.vx<0?-1:1;e.dmgDone=false}}
  else if(e.st==='dive'){e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.y>GROUND)e.y=GROUND;if(!e.dmgDone&&ov({l:e.x-7,r:e.x+7,t:e.y-20,b:e.y-4},pBox()))e.dmgDone=hurtPlayer(10,e.x);if(e.t<=0){e.st='walk';e.cd=rnd(2,3.2)}}}
 const inS=e.x>B.camX+12&&e.x<B.camX+W-12;if(inS)e.entered=true;if(e.entered)e.x=clamp(e.x,B.camX+12,B.camX+W-12);else e.x=clamp(e.x,B.camX-60,B.camX+W+60)}
// --- Vexa-3 "Scarlet Shift"
function updateVexa(dt){const V=B.V,P=B.P;if(!V)return;V.flash-=dt;V.anim+=dt*8;V.t-=dt;const p2=V.hp<=V.max/2;const dx=P.x-V.x;
 if(V.st==='intro'){V.x=lerp(V.x,250,dt*1.6);V.face=-1;if(V.t<=0){V.st='walk';V.t=0}return}
 if(V.st==='down'){if(V.t<=0&&!B.ended){B.ended=true;stageClear('VEXA-3 DEFEATED!')}return}
 if(V.st==='walk'){V.face=dx<0?-1:1;if(Math.abs(dx)>58)V.x+=V.face*(p2?82:58)*dt;if(V.cyc>=(p2?2:3)){V.st='vanish';V.t=0.55;sfx('phase')}else if(Math.abs(dx)<66&&V.t<=0){V.st='wind';V.t=p2?0.36:0.5;sfx('step')}}
 else if(V.st==='wind'){if(V.t<=0){V.st='whip';V.t=0.28;V.hit=false;sfx('whip')}}
 else if(V.st==='whip'){const a=V.x+V.face*8,b=V.x+V.face*80;if(!V.hit&&ov({l:Math.min(a,b),r:Math.max(a,b),t:GROUND-20,b:GROUND-9},pBox()))V.hit=hurtPlayer(14,V.x);
  if(V.t<=0){if(p2&&!V.dbl){V.dbl=true;V.st='wind';V.t=0.25}else{V.dbl=false;V.st='recover';V.t=0.75;V.cyc++}}}
 else if(V.st==='recover'){if(V.t<=0){V.st='walk';V.t=0.4}}
 else if(V.st==='vanish'){if(V.t<=0){V.hidden=true;V.st='mirage';const n=p2?4:3,xs=[30,290,110,210].slice(0,n).sort(()=>Math.random()-.5),real=rint(0,n-1);
   V.figs=xs.map((x,i)=>({x,real:i===real,st:'prep',t:1.0+i*0.3,dir:1,popped:false,hit:false}));banner('ONLY THE SHIMMERING ONE IS REAL!',1.6)}}
 else if(V.st==='mirage'){let live=0;for(const f of V.figs){if(f.popped||f.st==='done')continue;live++;f.t-=dt;
   if(f.st==='prep'){f.dir=P.x<f.x?-1:1;if(f.t<=0){f.st='dash';f.t=1.1;if(f.real)sfx('whip')}}
   else if(f.st==='dash'){f.x+=f.dir*300*dt;if(ov({l:f.x-6,r:f.x+6,t:GROUND-26,b:GROUND},pBox())){if(f.real){if(!f.hit)f.hit=hurtPlayer(16,f.x-f.dir*10)}else if(P.dash<=0&&P.inv<=0){f.popped=true;spark(f.x,GROUND-14,14,[C.rd3,C.wh],80);sfx('decoy')}}
    if(f.t<=0||f.x<-30||f.x>350){f.st='done';if(f.real)V.x=clamp(f.x,24,296)}}}
  if(!live){endMirage()}}
 V.comboT-=dt;if(V.comboT<=0)V.combo=0;if(V.combo>=5&&V.hp>0&&V.st!=='mirage'&&V.st!=='vanish'&&V.st!=='down'){V.combo=0;V.st='vanish';V.t=0.35;sfx('phase');banner(pick(['VEXA-3: TOO SLOW.','VEXA-3: CATCH ME.','VEXA-3: AFTERIMAGE!']),1.2)}
 V.x=clamp(V.x,-40,360)}
function endMirage(){const V=B.V;const rf=V.figs.find(f=>f.real);if(rf)V.x=clamp(rf.x,24,296);V.figs=[];V.hidden=false;V.st='recover';V.t=1.0;V.cyc=0;B.picks.push({x:clamp(160+rnd(-80,80),30,290),y:GROUND,type:'orb'})}
function hitVexa(box,dmg){const V=B.V,P=B.P;if(V.st==='intro'||V.st==='down')return;
 if(V.st==='mirage'){for(const f of V.figs){if(f.popped||f.st==='done'||f.lastHit===P.atkId)continue;if(ov(box,{l:f.x-8,r:f.x+8,t:GROUND-30,b:GROUND})){f.lastHit=P.atkId;
   if(f.real){damageVexa(dmg);V.figs.forEach(o=>{if(!o.real&&!o.popped){o.popped=true;spark(o.x,GROUND-14,12,[C.rd3,C.wh],70)}});endMirage();V.t=1.1;banner('FOUND YOU!',1)}else{f.popped=true;spark(f.x,GROUND-14,14,[C.rd3,C.pu3,C.wh],80);sfx('decoy');addScore(50)}}}return}
 if(V.hidden||V.lastHit===P.atkId)return;if(ov(box,{l:V.x-8,r:V.x+8,t:GROUND-30,b:GROUND})){V.lastHit=P.atkId;damageVexa(dmg);if(V.st==='wind'&&P.combo===3){V.st='recover';V.t=0.6}V.x+=P.face*4}}
function damageVexa(dmg){const V=B.V;V.hp-=dmg;V.combo++;V.comboT=1.2;V.flash=0.12;gainHit(V.x,GROUND-16);addScore(30);
 if(V.hp<=0){V.hp=0;V.st='down';V.t=2.6;V.hidden=false;V.figs=[];addScore(5000);sfx('boom');shake(10);flash(C.wh,.4);spark(V.x,GROUND-16,50,[C.rd2,C.rd3,C.em1,C.wh,C.pu3],160);stopSong();banner('VEXA-3 IS DOWN!',2.5)}
 else if(V.hp<=V.max/2&&V.hp+dmg>V.max/2){banner('VEXA-3: NOW I\'M DONE PLAYING.',2);flash(C.rd2,.2)}}
// --- drawing
function drawS(img,x,y,face,camX,alpha){ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.translate(Math.round(x-camX),Math.round(y));if(face<0)ctx.scale(-1,1);ctx.drawImage(img,-(img.width>>1),-img.height);ctx.restore()}
function drawBrawlBG(cx){sky([C.blk,C.nv0,'#0e1438',C.nv1,C.pu0,'#3a1460']);boltDraw();tiled(BG.mtn1,cx*0.1,44);tiled(BG.spires,cx*0.3,62);tiled(BG.dune,cx*0.6,128);groundDraw(cx,false)}
function drawArenaBG(cx){sky([C.blk,'#12030a','#240612',C.rd0,'#3a0a2a',C.pu0]);boltDraw();tiled(BG.mtnR,cx*0.1,44);tiled(BG.spires,cx*0.3,62);tiled(BG.dune,cx*0.6,128);groundDraw(cx,true)}
function groundDraw(cx,red){R(0,GROUND,W,H-GROUND,'#0d0916');R(0,GROUND,W,1,red?C.rd1:C.pu1);R(0,GROUND+1,W,2,C.k3);
 for(let i=-1;i<22;i++){const wx=Math.floor(cx/16)*16+i*16,sx=wx-cx,h=(wx*7919)%97;R(sx+(h%12),GROUND+5+(h%14),2,1,h%3?C.k4:(red?C.rd1:C.pu1));R(sx+((h*3)%14),GROUND+12+(h%5),1,1,C.gy1)}}
function drawPlayer(cx){const P=B.P;let k;if(P.dash>0)k='dash';else if(P.hurtT>0)k='hurt';else if(P.atk>0)k='atk'+P.combo;else if(!P.onG)k='jump';else if(Math.abs(P.vx)>5)k='run'+(Math.floor(P.anim)%4);else k='idle'+(Math.floor(P.anim)%2);
 for(const g of P.ghosts)drawS(SPR.drW.dash,g.x,g.y,g.f,cx,g.t*1.6*0.6);
 if(P.inv>0&&P.dash<=0&&P.hurtT<=0&&(B.t*20|0)%2)return;
 if(P.surge>0){const o=(B.t*20|0)%2;drawS(SPR.drR[k],P.x-1-o,P.y,P.face,cx,.8);drawS(SPR.drR[k],P.x+1+o,P.y,P.face,cx,.8);drawS(SPR.drR[k],P.x,P.y-1-o,P.face,cx,.6)}
 drawS(P.hurtT>0&&(B.t*30|0)%2?SPR.drW[k]:SPR.dr[k],P.x,P.y,P.face,cx);
 if(P.atk>0){const el=P.atkDur-P.atk;if(el>=0.03&&el<=0.2){const col=P.surge>0?C.em2:C.pu3,big=P.combo===3;for(let i=0;i<9;i++){const a=-1.1+i*0.275;const r=big?17:14;const px=P.x+P.face*(9+Math.cos(a)*r)-cx,py=P.y-(big?18:15)+Math.sin(a)*(big?16:9)*(big?-1:1);R(px,py,2,2,col);if(i%2)R(px,py,1,1,C.wh)}}}}
function drawEnemy(e,cx){const fl=e.flash>0;let img;
 if(e.type==='sol'){const i=e.st==='wind'?2:e.st==='slash'?3:(Math.floor(e.anim)%2);img=(fl?SPR.solW:SPR.sol)[i]}
 else if(e.type==='rob'){const i=e.st==='aim'?2:(Math.floor(e.anim/2)%2);img=(fl?SPR.robW:SPR.rob)[i]}
 else{const i=Math.floor(e.anim)%2;img=(fl?SPR.demW:SPR.dem)[i]}
 if(e.type!=='dem'){ctx.globalAlpha=.4;R(e.x-cx-8,GROUND-1,16,2,C.blk);ctx.globalAlpha=1}else{ctx.globalAlpha=.3;R(e.x-cx-5,GROUND-1,10,2,C.blk);ctx.globalAlpha=1}
 drawS(img,e.x,e.y+(e.type==='dem'?2:0),e.face,cx);if(e.st==='wind'&&(B.t*16|0)%2)R(e.x-cx-1,e.y-34,2,4,C.em2)}
function vexaFrame(V){if(V.st==='down')return'kneel';if(V.st==='wind')return'whipw';if(V.st==='whip')return'whip';if(V.st==='recover')return V.t>0.5?'hurt':'idle0';if(V.st==='walk'||V.st==='intro')return'run'+(Math.floor(V.anim)%4);return'idle'+(Math.floor(V.anim/4)%2)}
function drawVexa(cx){const V=B.V;if(!V)return;
 if(V.st==='mirage'){for(const f of V.figs){if(f.popped||f.st==='done')continue;const k=f.st==='dash'?'dash':'idle'+(Math.floor(V.anim/4)%2);const face=f.st==='dash'?f.dir:(B.P.x<f.x?-1:1);
   if(f.real){drawS(SPR.vx[k],f.x,GROUND,face,cx);ctx.globalAlpha=.6;R(f.x-cx-8+((B.t*30)%16),GROUND-31,2,31,C.wh);ctx.globalAlpha=1;for(let i=0;i<3;i++)if(Math.random()<.8)R(f.x-cx+rnd(-9,9),GROUND-rnd(0,32),1,1,pick([C.wh,C.em2,C.rd3]))}
   else{ctx.globalAlpha=.55;const img=SPR.vx[k];for(let y=0;y<32;y+=2){ctx.save();ctx.translate(Math.round(f.x-cx+rint(-1,1)),GROUND-32+y);if(face<0)ctx.scale(-1,1);ctx.drawImage(img,0,y,24,1,-12,0,24,1);ctx.restore()}ctx.globalAlpha=1}
   if(f.st==='dash')for(let i=1;i<4;i++)drawS(SPR.vxW.dash,f.x-f.dir*i*10,GROUND,f.dir,cx,.25/i)}return}
 if(V.hidden)return;const k=vexaFrame(V);if(V.st==='vanish'&&(B.t*20|0)%2)return;
 ctx.globalAlpha=.4;R(V.x-cx-8,GROUND-1,16,2,C.blk);ctx.globalAlpha=1;drawS(V.flash>0?SPR.vxW[k]:SPR.vx[k],V.x,V.y,V.face,cx);
 const hx=V.x-cx+V.face*12,hy=V.y-19;
 if(V.st==='whip'){for(let i=0;i<70;i++){const px=hx+V.face*i,py=hy+5+Math.sin(i*0.28+B.t*40)*3*(1-i/70);R(px,py,1,2,C.rd3);if(i%3===0)R(px,py,1,1,C.em2)}R(hx+V.face*70,hy+3,3,3,C.wh)}
 if(V.st==='wind'){for(let i=0;i<16;i++){const a=i/16*Math.PI*2+B.t*14;R(V.x-cx-V.face*2+Math.cos(a)*9,V.y-36+Math.sin(a)*4,2,1,i%2?C.rd3:C.em2)}}}
function renderBrawl(){const cx=Math.round(B.camX);if(B.boss)drawArenaBG(cx);else drawBrawlBG(cx);
 for(const pl of B.plats){const x=pl.x-cx;if(x>W||x+pl.w<0)continue;R(x,pl.y,pl.w,6,C.k3);R(x,pl.y,pl.w,1,C.pu2);R(x+2,pl.y+6,pl.w-4,3,C.k1);R(x+pl.w/2-2,pl.y+9,4,4,C.k1)}
 for(const k of B.picks){const bob=Math.sin(B.t*5+k.x)*2;const img=k.type==='orb'?SPR.orb:SPR.heart;ctx.drawImage(img,Math.round(k.x-cx-img.width/2),Math.round(k.y-img.height-3+bob))}
 for(const e of B.en)drawEnemy(e,cx);drawVexa(cx);drawPlayer(cx);
 for(const s of B.shots){R(s.x-cx-3,s.y-1,6,3,C.em1);R(s.x-cx-1,s.y,2,1,C.wh);R(s.x-cx-s.vx/30-2,s.y,3,1,C.rd2)}
 drawFx(cx,false);drawHUD();
 if(!B.boss){const pr=clamp(B.P.x/B.W,0,1);R(120,24,80,3,C.k3);R(120,24,80*pr,3,C.pu2);R(119+80*pr,22,3,7,C.wh);
  if(B.goT>0&&B.wi<B.waves.length&&(B.t*3|0)%2)txt('GO >>',290,80,C.em2,2,'r',C.rd1);if(B.wi>=B.waves.length&&(B.t*3|0)%2)txt('EXIT >>',300,80,C.em2,2,'r',C.rd1)}
 if(B.V){const V=B.V;txt('VEXA-3 "SCARLET SHIFT"',180,3,C.rd3,1,'c',true);bar(124,11,112,5,V.hp/V.max,V.flash>0?C.wh:C.rd2,C.rd0)}}

// ===== main loop, render dispatch, debug =====
function engineType(){if(G.state==='paused')return G.prevState;if(G.state==='dead'||G.state==='clear')return STAGES[G.stage].type==='race'?'race':'brawl';return G.state}
function update(dt){G.t+=dt;I.poll();musicTick();
 if(I.p('start')&&isPlayState()){pauseGame();return}
 if(G.state==='race')updateRace(dt);else if(G.state==='brawl')updateBrawl(dt);
 else{if(G.state==='clear'&&RC&&STAGES[G.stage].type==='race')updateRace(dt);updateMenus(dt)}
 if(G.state!=='paused')updFx(dt);
 if(['title','story','gameover','howto','card'].includes(G.state))boltUpdate(dt,3.5,G.state==='gameover')}
function render(){ctx.save();ctx.imageSmoothingEnabled=false;if(G.shake>0)ctx.translate(Math.round(rnd(-G.shake,G.shake)*.6),Math.round(rnd(-G.shake,G.shake)*.6));
 const e=engineType();
 if(e==='race'&&RC)renderRace();else if(e==='brawl'&&B)renderBrawl();
 else if(e==='title')drawTitle();else if(e==='howto')drawHow();else if(e==='story')drawStory();else if(e==='card')drawCard();else if(e==='gameover')drawGameOver();else if(e==='ending')drawEnding();
 if(G.banner&&(e==='race'||e==='brawl')){const s=G.banner.s,lines=wrap(s,70);const h=lines.length*8+6;R(0,38,W,h,'rgba(5,4,10,.6)');lines.forEach((l,i)=>txt(l,160,41+i*8,C.wh,1,'c',C.pu1))}
 if(G.state==='paused')drawPause();
 if(G.state==='dead'){R(0,0,W,H,'rgba(58,6,16,.45)');txt(G.deadMsg,160,70,C.rd3,2,'c',C.blk);txt(G.lives>0?'LIVES LEFT: '+G.lives:'NO LIVES LEFT',160,92,C.wh,1,'c',true)}
 if(G.state==='clear'){R(0,62,W,44,'rgba(5,4,10,.7)');txt('STAGE CLEAR!',160,68,C.em2,3,'c',C.rd1);txt(G.clearMsg,160,92,C.wh,1,'c',true)}
 if(G.flash>0){ctx.globalAlpha=Math.min(.35,G.flash*2);R(0,0,W,H,G.flashC);ctx.globalAlpha=1}
 ctx.restore();if(DEBUG)txt('DEBUG',2,174,C.em2,1)}
function debugKey(n){initAudio();if(n>=1&&n<=4){G.lives=3;startStage(n-1);beginStage();updateTouchUI()}else if(n===5){startEnding()}
 else if(n===9){if(G.state==='race'){RC.done=true;stageClear('DEBUG WIN')}else if(G.state==='brawl'){if(B.boss)damageVexa(999);else{B.ended=true;stageClear('DEBUG WIN')}}}
 else if(n===0){G.health=100;G.energy=100;G.adren=100}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&isPlayState())pauseGame()});
window.RZ={get G(){return G},get RC(){return RC},get B(){return B},I,update,render,startStage,beginStage,debugKey,STAGES};
let last=performance.now();
function loop(now){let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;if(dt>0)update(dt);render();requestAnimationFrame(loop)}
try{if(window.parent&&window.parent!==window)document.getElementById('foot').style.bottom='48px'}catch(e){}
G.wantSong='title';setState('title');requestAnimationFrame(loop);
