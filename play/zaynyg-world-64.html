function tree(m,x,y,z,s,c1,c2){s=s||1;m.cyl(x,y,z,0.25*s,1.4*s,5,'#6b4423');m.cone(x,y+1.0*s,z,1.3*s,1.6*s,7,c1||'#2f9a4a');m.cone(x,y+2.0*s,z,0.95*s,1.4*s,7,c2||'#46b85c')}
function lamp(m,x,y,z,c){m.cyl(x,y,z,0.1,3,5,'#3a3d44');m.cbox(x,y+3.15,z,0.45,0.35,0.45,col(c||'#fff2a8',1))}
function crystalProp(m,x,y,z,s,c){octa(m,x,y+s,z,0.35*s,s,col(c||'#b45cff',.7))}
function house(m,x,y,z,w,d,h,c,roof,rot){m.at(M4.trs(x,y,z,rot||0),q=>{q.box(-w/2,0,-d/2,w/2,h,d/2,c);q.quad([-w/2-0.2,h,d/2+0.2],[w/2+0.2,h,d/2+0.2],[w/2+0.2,h+1.2,0],[-w/2-0.2,h+1.2,0],roof);q.quad([w/2+0.2,h,-d/2-0.2],[-w/2-0.2,h,-d/2-0.2],[-w/2-0.2,h+1.2,0],[w/2+0.2,h+1.2,0],shade(roof,.85));
  q.tri([-w/2,h,-d/2],[-w/2,h,d/2],[-w/2,h+1.2,0],c);q.tri([w/2,h,d/2],[w/2,h,-d/2],[w/2,h+1.2,0],c);q.box(-0.4,0,d/2,0.4,1.4,d/2+0.05,'#6b4423');q.box(-w/2+0.4,h*0.5,d/2,-w/2+1.1,h*0.5+0.7,d/2+0.05,col('#ffe9a0',.5));q.box(w/2-1.1,h*0.5,d/2,w/2-0.4,h*0.5+0.7,d/2+0.05,col('#ffe9a0',.5))})}
function tower(m,x,y,z,w,h,c,win){m.box(x-w/2,y,z-w/2,x+w/2,y+h,z+w/2,c);for(let fy=y+1;fy<y+h-1;fy+=1.6)for(let i=0;i<3;i++){const wx=x-w/2+w*(i+0.5)/3;m.box(wx-0.3,fy,z+w/2,wx+0.3,fy+0.8,z+w/2+0.05,col(win||'#ffe9a0',(i+fy|0)%3?0.6:0.1));m.box(wx-0.3,fy,z-w/2-0.05,wx+0.3,fy+0.8,z-w/2,col(win||'#ffe9a0',0.3))}}
function portalMesh(c,c2){return mk(m=>{m.ring(0,2.6,0,2.4,0.32,16,col(c,.35));for(let i=0;i<8;i++){const a=i/8*TAU;m.sph(Math.cos(a)*2.4,2.6+Math.sin(a)*2.4,0,0.35,5,col(c2||'#ffffff',1))}m.box(-3,0,-0.6,3,0.3,0.6,'#3a3d44')})}
function swirlMesh(c){return mk(m=>{for(let i=0;i<12;i++){const a0=i/12*TAU,a1=(i+1)/12*TAU;const cc=i%2?c:shade(c,1.5);m.tri([0,0,0],[Math.cos(a0)*2.1,Math.sin(a0)*2.1,0],[Math.cos(a1)*2.1,Math.sin(a1)*2.1,0],col(cc,1));m.tri([0,0,0],[Math.cos(a1)*2.1,Math.sin(a1)*2.1,0],[Math.cos(a0)*2.1,Math.sin(a0)*2.1,0],col(cc,1))}})}
function skyMesh(top,mid,bot,stars){return mk(m=>{const seg=16,rings=[[1,top],[0.55,mid],[0.12,bot],[-0.3,bot]];for(let r=0;r<rings.length-1;r++){const[y0,c0]=rings[r],[y1,c1]=rings[r+1];const r0=Math.sqrt(1-Math.min(.99,y0*y0)),r1=Math.sqrt(1-Math.min(.99,y1*y1));
  for(let i=0;i<seg;i++){const a0=i/seg*TAU,a1=(i+1)/seg*TAU;const A=[Math.cos(a0)*r0,y0,Math.sin(a0)*r0],B=[Math.cos(a1)*r0,y0,Math.sin(a1)*r0],C=[Math.cos(a1)*r1,y1,Math.sin(a1)*r1],D=[Math.cos(a0)*r1,y1,Math.sin(a0)*r1];
   // inward faces; manual vertex colors for gradient

/* ---------- world loading, camera, rendering, HUD, menus, loop ---------- */
const TOTAL_STARS=18,RIFT_REQ=12;
function save(){try{localStorage.setItem('zw64_save',JSON.stringify({stars:[...G.stars],coins:G.coins,ended:G.ended,hero:P.hero,t:G.playTime|0}))}catch(e){}}
function loadSave(){try{const s=JSON.parse(localStorage.getItem('zw64_save')||'null');return s}catch(e){return null}}
function worldStars(id){return Object.keys(STAR_NAMES).filter(k=>STAR_NAMES[k].w===id)}
function freeLevel(L){if(!L)return;freeMesh(L.mesh);freeMesh(L.sky);L.portals.forEach(p=>{freeMesh(p.mesh);freeMesh(p.sw)});L.npcs.forEach(n=>{if(n.H)for(const k in n.H.P)freeMesh(n.H.P[k])});L.movers.forEach(s=>freeMesh(s.mesh))}

 L.enemies.forEach(initEnemy);L.shardsGot=0;L.items.forEach(it=>{if(it.k==='star'&&G.stars.has(it.id))it.ghost=true});
 G.L=L;G.w=i;G.proj=[];G.waves=[];G.parts=[];G.checkpoint=null;G.bossOn=false;G.boss=null;
 if(L.boss){const b=L.boss;G.boss=makeBoss(Object.assign({},b,{x0c:b.x,z0c:b.z}))}
 G.clouds=[];if(w.id==='hub'||w.id==='city'||w.id==='tinker')for(let k=0;k<10;k++)G.clouds.push({x:rnd(-90,90),y:rnd(22,40),z:rnd(-110,60),s:rnd(1.5,3),v:rnd(0.5,1.5)});
 let sp=L.spawn;if(i===0&&from>0){const p=L.portals.find(q=>q.target===from);if(p){const dx=-p.x,dz=-p.z+2,l=Math.hypot(dx,dz)||1;sp=[p.x+dx/l*4,p.y,p.z+dz/l*4,Math.atan2(dx,dz)]}}
 resetPlayer(sp[0],sp[1]+0.1,sp[2],sp[3]);G.checkpoint=[sp[0],sp[1],sp[2],sp[3]];updateSat(true);SND.play(w.music);
 banner(w.name,w.sub,i===0?'#ffd23a':'#ffffff',2.8);G.hint=null;if(w.id==='tinker'&&G.satT<1)setTimeout(()=>{if(WORLDS[G.w].id==='tinker')toast('Tinkerbrook is losing its colors! Each star brings some back.','#ffd23f')},1500)}
function updateSat(snap){const w=WORLDS[G.w];let s=w.sat;if(w.id==='tinker'){const n=worldStars('tinker').filter(k=>G.stars.has(k)).length;s=Math.min(1,0.3+n*0.175)}G.satT=s;if(snap)G.sat=s}
/* fades */
function fadeOut(cb,t){G.fadeTo=1;G.fadeCB=cb;G.fadeSpd=1/(t||0.5)}
function updFade(dt){if(G.fadeTo===1){G.fade=Math.min(1,G.fade+dt*(G.fadeSpd||2));if(G.fade>=1){const cb=G.fadeCB;G.fadeCB=null;G.fadeTo=0;if(cb)cb()}}else G.fade=Math.max(0,G.fade-dt*2.2)}
function goWorld(i){if(G.fadeCB)return;SND.sfx('portal');const from=G.w;fadeOut(()=>{loadWorld(i,from);if(i===5&&!G.riftSeen){G.riftSeen=1;story([['PROFESSOR BYTE','This is the Static Rift - where the Null Crown hides!'],['PROFESSOR BYTE','Cross the floating pieces of every world. Then hit its 3 crystals to bring it down!']])}},0.45)}
/* items, portals, boss trigger */
function updateWorld(dt){const L=G.L;
 for(const s of L.movers){s.mv.ph+=dt;const ox=s.cx,oz=s.cz;placeMover(s,s.mv.ph);s.dx=s.cx-ox;s.dz=s.cz-oz}
 for(const it of L.items){if(it.got||it.hidden)continue;if(it.pop){it.vy=(it.vy||0)-20*dt;it.y+=it.vy*dt;const g=groundAt(L,it.x,it.z,it.y+0.5,null,0);if(it.y<g.y+0.6){it.y=g.y+0.6;it.vy=0;it.pop=0}}
  const d=Math.hypot(P.x-it.x,P.z-it.z),dy=it.y-(P.y+0.9);if(d<(it.k==='star'?1.4:1.1)&&Math.abs(dy)<1.5){collect(it)}}
 for(const p of L.portals){const d=Math.hypot(P.x-p.x,P.z-p.z);if(d<1.7&&Math.abs(P.y-p.y)<2.5&&G.state==='play'&&!G.fadeCB){if(G.stars.size>=p.req)goWorld(p.target);else{const l=d||1;P.x=p.x+(P.x-p.x)/l*2.2;P.z=p.z+(P.z-p.z)/l*2.2;P.vx=P.vz=0;hintOnce('lock'+p.target,'Needs '+p.req+' ★ to open. You have '+G.stars.size+'.');SND.sfx('hurt')}}}
 const b=G.boss;if(b&&b.alive&&!G.bossOn&&G.state==='play'){if(Math.hypot(P.x-b.x0c,P.z-b.z0c)<b.trig&&P.y>b.y0-1){G.bossOn=true;b.reset();SND.play(b.final?'final':'boss');banner(b.name,'',b.c,2.2);if(b.intro)story(b.intro)}}
 if(b&&b.alive&&G.bossOn)b.update(dt);
 for(const n of L.npcs){const d=Math.hypot(P.x-n.x,P.z-n.z);const ty=d<6?Math.atan2(P.x-n.x,P.z-n.z):n.yaw0;n.yaw+=angDiff(n.yaw,ty)*Math.min(1,dt*4)}
 const nt=nearTalk();G.near=nt&&!G.bossOn?nt:null;

function collect(it){const L=G.L;it.got=true;
 if(it.k==='coin'){G.coins++;if(P.hp<P.maxhp)P.hp++;SND.sfx('coin');burst(it.x,it.y,it.z,'#ffd23a',6,3,0.4,0.15)}

  banner(isNew?'ZAY STAR GET!':'STAR AGAIN!',it.name+'  ·  ★ '+G.stars.size+' / '+TOTAL_STARS,'#ffd23a',3);P.hp=P.maxhp;updateSat();
  if(isNew&&G.stars.size===RIFT_REQ)setTimeout(()=>toast('THE STATIC RIFT IS OPEN! (top of the tower)','#ffffff'),2500);

  G.state='starget';G.stargetT=1.8;G.stargetBoss=/4$/.test(it.id)}}
/* camera */
function camSolid(x,y,z){for(const s of G.L.solids){if(s.dead||s.phase||s.glitch)continue;if(s.t==='box'){if(x>s.x0&&x<s.x1&&z>s.z0&&z<s.z1&&y>s.y0&&y<s.y1)return true}else if(s.t==='cyl'){if(y>s.y0&&y<s.y1&&Math.hypot(x-s.x,z-s.z)<s.r)return true}else if(s.t==='ramp'){const t=topAt(s,x,z,0);if(t!==null&&y<t&&y>s.y0)return true}}return false}
function updateCam(dt,snap){const c=G.cam;const man=IN.cam*dt*2.6+IN.camDrag;c.yaw+=man;if(Math.abs(man)>1e-4)c.manualT=0;else c.manualT+=dt;
 c.pitch=clamp(c.pitch+IN.camY,0.05,1.15);
 const hs=Math.hypot(P.vx,P.vz);if(c.manualT>0.9&&hs>2&&IN.dev!=='none'){const f=[-Math.sin(c.yaw),-Math.cos(c.yaw)];const mv=[P.vx/hs,P.vz/hs];const dot=f[0]*mv[0]+f[1]*mv[1];const want=P.yaw+Math.PI;c.yaw+=angDiff(c.yaw,want)*dt*1.3*Math.max(0,dot+0.2)}
 const dist=G.bossOn?13:c.dist,k=snap?1:Math.min(1,dt*9);const bb=G.bossOn&&G.boss&&G.boss.alive?G.boss:null;const fx2=bb?lerp(P.x,bb.x,0.25):P.x,fz2=bb?lerp(P.z,bb.z,0.25):P.z,fy2=P.y+1.3+(bb?Math.max(0,Math.min(6,bb.y-P.y))*0.3:0);c.tx=lerp(c.tx,fx2,k);c.tz=lerp(c.tz,fz2,k);c.ty=lerp(c.ty,fy2,snap?1:Math.min(1,dt*(P.onG?6:2.5)));
 if(Math.abs(c.ty-fy2)>4)c.ty=fy2+Math.sign(c.ty-fy2)*4;
 const pit=c.pitch+(G.bossOn?0.12:0);const dx=Math.sin(c.yaw)*Math.cos(pit),dy=Math.sin(pit),dz=Math.cos(c.yaw)*Math.cos(pit);let d=dist;
 for(let s=1;s<=10;s++){const t=s/10*dist;if(camSolid(c.tx+dx*t,c.ty+dy*t,c.tz+dz*t)){d=Math.max(1.5,t-0.6);break}}
 c.cd=snap?d:lerp(c.cd||d,d,Math.min(1,dt*(d<(c.cd||d)?14:3)));c.x=c.tx+dx*c.cd;c.y=c.ty+dy*c.cd;c.z=c.tz+dz*c.cd}

 txt('© 2026 Zaynyg World · an original Zaynyg World game',W/2,H-u*3,u*2,'rgba(255,255,255,.75)','center')}

const CREDITS=['THE NULL CROWN IS SHATTERED!','','Umbraxis has its light back.','Dripwater City is glitch-free (and pizza-shaped only at lunch).','Tinkerbrook is bursting with color.','Cinderfall cooled down... a little.','','THANK YOU, HEROES!','DRAYKE CROSS · ZAY · NOVA REYES · AURIEL SWIFT','','STARRING','Juno-7 · Professor Byte · Gramma Juniper · Maya · Bloop','Tony · Mayor Penny Moss · Professor Orrin Vale · Tug','Tinker Nyx · Vexa-3','','BOSSES','The Hollow King · Pizza Emperor · The Still Engine','Cinder Maw · The Null Crown','','ZAYNYG WORLD 64','A Zaynyg World original game','© 2026 Zaynyg World','','Be kind. Stay curious. Keep playing!'];
function startEnding(){if(G.state==='ending')return;fadeOut(()=>{G.ended=true;save();loadWorld(0,0);G.banner=null;G.state='ending';G.endT=0;SND.play('ending');G.bossOn=false},1.2)}
function updEnding(dt){G.endT+=dt;if(Math.random()<dt*2.5){const a=Math.random()*TAU,r=rnd(8,22);burst(Math.cos(a)*r,rnd(14,24),4+Math.sin(a)*r,['#ffd23a','#b45cff','#3ae0c8','#ff7a1a','#ff4df0','#ffffff'][(Math.random()*6)|0],34,9,1.4,0.35);SND.sfx('poof')}
 if(G.endT>6&&(IN.tapP||IN.okP||IN.pauseP)||G.endT>CREDITS.length*1.6+14){G.state='play';P.hero=1;loadWorld(0,0);banner('THE END','Thanks for playing! Keep exploring the Plaza.','#ffd23a',4)}}
function renderEnding(){const a=G.endT*0.2;const eye=[Math.sin(a)*14,5+Math.sin(G.endT*0.3),4+Math.cos(a)*14];renderScene(eye,[0,2,4],()=>{HEROES.forEach((h,i)=>{const ang=i/4*TAU+0.4,x=Math.cos(ang)*5,z=4+Math.sin(ang)*5;const j=Math.abs(Math.sin(G.endT*4+i))*1.2;drawHumanoid(h.H,x,j,z,Math.atan2(eye[0]-x,eye[2]-z),{walk:0.5,ph:G.endT*8+i,armUp:-2.6});drawShadow(x,j,z,0.6)})})}
function hudEnding(){const u=Math.min(W,H)/100;logo(W/2,H*0.12,u*6);const y0=H*0.95-G.endT*u*5.5;CREDITS.forEach((s,i)=>{const y=y0+i*u*5.5+H*0.1;if(y>H*0.32&&y<H*0.9){X.globalAlpha=clamp(Math.min((y-H*0.32)/(H*0.08),(H*0.9-y)/(H*0.06)),0,1);txt(s,W/2,y,i===0||s==='ZAYNYG WORLD 64'?u*4:u*3,i===0?'#ffd23a':'#fff','center')}});X.globalAlpha=1;
 txt('★ '+G.stars.size+' / '+TOTAL_STARS+'  ·  coins '+G.coins+'  ·  time '+Math.floor(G.playTime/60)+'m'+String(Math.floor(G.playTime%60)).padStart(2,'0')+'s',W/2,H*0.25,u*2.6,'#ffd23a','center');if(G.endT>6)txt(TOUCH?'tap to continue':'press any button',W/2,H-u*8.5,u*2.2,'#fff','center')}
/* ---------- main loop ---------- */
let last=0;G.dt=0.016;
function newGame(fresh){if(fresh){G.stars=new Set();G.coins=0;G.ended=false;G.playTime=0}else{const s=loadSave();if(s){G.stars=new Set(s.stars||[]);G.coins=s.coins||0;G.ended=!!s.ended;G.playTime=s.t||0;P.hero=s.hero||1}}
 save();SND.resume();fadeOut(()=>{loadWorld(0,0);G.state='play';P.hp=P.maxhp;if(fresh)story([['PROFESSOR BYTE','Welcome to ZAYNYG PLAZA - the place where every Zaynyg World meets!'],['PROFESSOR BYTE','But the NULL CROWN appeared and spread STATIC everywhere. It powered up the Hollow King, the Pizza Emperor, the Still Engine and Cinder Maw!'],['PROFESSOR BYTE','Four heroes answered: DRAYKE of the RIDAHZ, ZAY of the GLITCH KIDS, NOVA of the MICRO METAMORPHOSIS MACHINES, and AURIEL of the RIDAHZ FIGHTERS.'],['PROFESSOR BYTE','Jump into the portals and collect ZAY STARS. With 12 stars, the Static Rift on top of the tower will open!'],['PROFESSOR BYTE',TOUCH?'Left thumb moves. A jumps, B hits, ★ is your hero MOVE, ⇄ swaps heroes. Drag the right side to turn the camera.':'Move: arrows/WASD or stick. Jump: Space. Hit: J. Hero MOVE: K. Swap hero: Tab (or 1-4). Camera: Q/E, mouse drag or right stick.']])},0.5)}
function tick(dt){G.t+=dt;G.dt=dt;pollInput();
 if(DEBUG&&IN.tapP&&IN.tap&&G.state!=='title'&&dbgClick(IN.tap)){clearInput();return}
 if(DEBUG&&G.state==='play'){if(KP['g'])ZW64.stars(G.stars.size+1);if(KP['b'])ZW64.boss();if(KP['n'])dbgDo('W'+((G.w+1)%6));if(KP['h'])P.hp=P.maxhp}
 updFade(dt);
 if(G.state==='title'){const a=menuInput();if(a==='new')newGame(true);else if(a==='cont')newGame(false);else if(a==='mus')SND.toggle();if(a&&a!=='mus')G.state='starting';}
 else if(G.state==='play'){G.playTime+=dt;if(G.endPending){G.endPending-=dt;if(G.endPending<=0){G.endPending=0;startEnding()}}if(IN.pauseP&&!G.fadeCB){G.state='pause';G.menu=0;SND.sfx('menu')}else{updatePlayer(dt);updateEnemies(dt);updateWorld(dt);updateProj(dt);updateWaves(dt);updParts(dt);updateCam(dt)}}
 else if(G.state==='pause'){const a=menuInput();if(IN.pauseP||a==='res')G.state='play';else if(a==='hub'){G.state='play';goWorld(0)}else if(a==='mus')SND.toggle()}
 else if(G.state==='dlg'){updParts(dt);if(IN.okP||IN.tapP||IN.atkP||IN.jumpP){const d=G.dlg;d.i++;SND.sfx('menu');if(d.i>=d.lines.length){G.dlg=null;G.state='play';if(d.cb)d.cb()}}}
 else if(G.state==='starget'){G.stargetT-=dt;updParts(dt);P.yaw+=dt*6;if(G.stargetT<=0){G.state='play';if(G.stargetBoss&&G.w!==0){goWorld(0)}}}
 else if(G.state==='ending'){updParts(dt);updEnding(dt)}
 else if(G.state==='starting'){}
 clearInput()}
function render(){X.clearRect(0,0,W,H);
 if(G.state==='title'||G.state==='starting'){const a=G.t*0.12;renderScene([Math.sin(a)*34,14+Math.sin(G.t*0.2)*3,4+Math.cos(a)*34],[0,4,-4],()=>{HEROES.forEach((h,i)=>{const x=-4.5+i*3,z=8;drawHumanoid(h.H,x,0,z,Math.atan2(Math.sin(a)*34-x,4+Math.cos(a)*34-z),{walk:0.3,ph:G.t*3+i,armUp:i%2?-0.4:0});drawShadow(x,0,z,0.6)})});if(G.state==='title')hudTitle()}
 else if(G.state==='ending'){renderEnding();hudEnding()}
 else{const c=G.cam;renderScene([c.x,c.y,c.z],[c.tx,c.ty,c.tz]);
  if(G.state==='play'||G.state==='starget')hudPlay();if(G.state==='dlg'){hudPlay();hudDlg()}if(G.state==='pause')hudPause()}
 hudCommon()}
function frame(ts){const dt=Math.min(0.05,Math.max(0.001,(ts-last)/1000||0.016));last=ts;try{if(!G.manual)tick(dt);if(!G.freeze)render()}catch(e){console.error(e);G.err=String(e&&e.stack||e)}requestAnimationFrame(frame)}
/* ---------- init ---------- */
function init(){buildHeroes();buildEnemies();buildBosses();MESH.cloud=cloudMesh();
 WORLDS.forEach(w=>{const L=newLevel();w.build(L);L.items.forEach(it=>{if(it.k==='star')STAR_NAMES[it.id]={name:it.name,w:w.id}});freeLevel(Object.assign(L,{mesh:null,sky:null}))});
 const s=loadSave();if(s&&s.stars){G.stars=new Set(s.stars);G.coins=s.coins||0}
 loadWorld(0,0);G.banner=null;G.state='title';SND.play('title');HC.focus();requestAnimationFrame(frame)}
/* ---------- debug / test API ---------- */
const ZW64={G,P,HEROES,WORLDS,STAR_NAMES,
 go(i){G.state='play';loadWorld(i,G.w);return G.L.name},
 stars(n){const ids=Object.keys(STAR_NAMES);for(const k of ids){if(G.stars.size>=n)break;G.stars.add(k)}save();updateSat();toast('DEBUG ★ '+G.stars.size)},
 boss(){const b=G.boss;if(!b)return false;resetPlayer(b.x0c,b.y0+0.5,b.z0c+b.trig*0.8,Math.PI);return true},
 kill(){const b=G.boss;if(!b||!b.alive)return false;if(!G.bossOn){G.bossOn=true;b.reset()}G.dlg=null;G.state='play';b.hp=1;b.inv=0;bossHurt(b);return !b.alive},
 tp(x,y,z){resetPlayer(x,y,z,P.yaw)},
 reach(i,opt){const L=newLevel();WORLDS[i].build(L);const r=reachCheck(L,opt);freeLevel(Object.assign(L,{mesh:null,sky:null}));return r},
 end(){startEnding()},step(n,dt){for(let i=0;i<(n||1);i++)tick(dt||1/60);render()},
 state:()=>G.state,startNew:()=>newGame(true),key(k,d){if(d&&!KEYS[k])KP[k]=true;KEYS[k]=!!d},clear(){for(const k in KEYS)KEYS[k]=false}};
window.ZW64=ZW64;
init();

</script>
